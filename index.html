      {id:'japan-zaru-soba',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/6156/index.html',translations:{en:{title:'Chilled soba with noodle broth',copy:'A fast home meal using dried, boiled, or frozen soba and bottled noodle broth.'},zh:{title:'日式冷荞麦面',copy:'干荞麦面、熟面或冷冻面搭配市售面汤即可完成的快手家常饭。'},ja:{title:'ざるそば',copy:'乾そば、ゆでそば、冷凍そばと市販のつゆで作れる手軽な家庭料理。'},ko:{title:'자루소바',copy:'건메밀면·삶은 면·냉동면과 시판 쯔유로 빠르게 만드는 일본 가정식.'}},ingredients:[{label:'荞麦面',labels:{en:'soba noodles',zh:'荞麦面',ja:'そば',ko:'메밀국수'},names:['荞麦面','荞麦','soba','soba noodles','そば','메밀국수']}],seasonings:['soy'],equipment:['saucepan'],steps:{en:['Cook dried soba in plenty of boiling water; use the package time as a guide.','Drain, rinse well under cold water, and chill briefly so the noodles become firm.','Serve the noodles with chilled bottled noodle broth and, if available, scallion, nori, or wasabi.'],zh:['干荞麦面放入足量沸水中，按包装建议时间煮熟。','捞出后用冷水充分冲洗，稍微冰镇让面条更筋道。','配冰凉的市售面汤食用；有的话可加葱花、海苔或芥末。'],ja:['乾そばはたっぷりの湯で、表示時間を目安にゆでる。','ざるに上げて冷水でよく洗い、少し冷やして麺を締める。','冷たい市販のつゆに付け、あればねぎ、のり、わさびを添える。'],ko:['건메밀면을 넉넉한 끓는 물에 포장 시간에 맞춰 삶는다.','건져 찬물에 충분히 헹군 뒤 잠시 차게 해 면을 탱탱하게 만든다.','차가운 시판 쯔유에 찍어 먹고, 있으면 파·김·와사비를 곁들인다.']}},
      {id:'japan-oroshi-soba',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/5753/index.html',translations:{en:{title:'Oroshi soba',copy:'Chilled soba topped with grated daikon: a light use for soba and a daikon radish.'},zh:{title:'萝卜泥荞麦面',copy:'荞麦面搭配萝卜泥的清爽吃法，适合消耗一根白萝卜。'},ja:{title:'おろしそば',copy:'そばと大根をさっぱり食べられる、家庭でも作りやすい冷たいそば。'},ko:{title:'오로시소바',copy:'메밀국수와 무를 산뜻하게 먹는 간단한 일본식 냉소바.'}},ingredients:[{label:'荞麦面',labels:{en:'soba noodles',zh:'荞麦面',ja:'そば',ko:'메밀국수'},names:['荞麦面','soba','そば','메밀국수']},{label:'白萝卜',labels:{en:'daikon radish',zh:'白萝卜',ja:'大根',ko:'무'},names:['白萝卜','萝卜','daikon','daikon radish','大根','무']}],seasonings:['soy'],equipment:['saucepan'],steps:{en:['Cook the soba, then rinse it under cold water and drain well.','Grate daikon and gently squeeze only if it is extremely watery.','Pile the grated daikon on the noodles, add scallion if available, and pour over chilled noodle broth.'],zh:['煮好荞麦面，用冷水冲洗后充分沥干。','把白萝卜磨成泥；如果水分特别多，可轻轻挤掉一点。','萝卜泥堆在面上，有葱可加葱花，再淋上冰凉面汤。'],ja:['そばをゆで、冷水で洗って水気をよく切る。','大根をすりおろし、水分が多すぎる場合だけ軽くしぼる。','そばに大根おろしをのせ、あればねぎを加え、冷たいつゆをかける。'],ko:['메밀면을 삶아 찬물에 헹군 후 물기를 충분히 뺀다.','무를 갈고 물이 너무 많을 때만 살짝 짠다.','면 위에 무즙을 올리고, 있으면 파를 더한 뒤 차가운 쯔유를 붓는다.']}},
      {id:'japan-kate-soba',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/2902/index.html',translations:{en:{title:'Kate soba with daikon and chives',copy:'A Nagano-style soba meal that combines noodles with grated daikon and chives.'},zh:{title:'长野萝卜韭菜荞麦面',copy:'荞麦面搭配萝卜泥和韭菜的长野风味吃法。'},ja:{title:'かてそば',copy:'大根おろしやにらをそばに添える、長野の素朴なそば料理。'},ko:{title:'가테소바',copy:'간 무와 부추를 메밀국수에 곁들이는 나가노식 소박한 소바.'}},ingredients:[{label:'荞麦面',labels:{en:'soba noodles',zh:'荞麦面',ja:'そば',ko:'메밀국수'},names:['荞麦面','soba','そば','메밀국수']},{label:'白萝卜',labels:{en:'daikon radish',zh:'白萝卜',ja:'大根',ko:'무'},names:['白萝卜','萝卜','daikon','大根','무']},{label:'韭菜',labels:{en:'garlic chives',zh:'韭菜',ja:'にら',ko:'부추'},names:['韭菜','garlic chives','にら','부추']}],seasonings:['soy'],equipment:['saucepan'],steps:{en:['Cook soba and rinse it in cold water until the surface starch is gone.','Briefly blanch cut chives in the noodle water, then cool them.','Serve soba with grated daikon and chives; dip each bite in noodle broth.'],zh:['煮好荞麦面后用冷水冲掉表面淀粉。','用煮面的水快速焯一下切段韭菜，再放凉。','荞麦面搭配萝卜泥和韭菜，每一口蘸面汤吃。'],ja:['そばをゆで、表面のでんぷんが取れるまで冷水で洗う。','切ったにらをそばのゆで湯でさっとゆで、冷ます。','そばに大根おろしとにらを添え、つゆに付けながら食べる。'],ko:['메밀면을 삶아 표면 전분기가 없어질 때까지 찬물에 헹군다.','썬 부추를 면 삶은 물에 살짝 데친 뒤 식힌다.','면에 간 무와 부추를 곁들이고 쯔유에 찍어 먹는다.']}},
      {id:'japan-kenchin-soba',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/4960/index.html',translations:{en:{title:'Kenchin soba',copy:'A warming soba soup for chicken, tofu, root vegetables, and noodles.'},zh:{title:'日式杂煮荞麦面',copy:'鸡肉、豆腐、根茎蔬菜和荞麦面可做成暖胃的一碗汤面。'},ja:{title:'けんちんそば',copy:'鶏肉、豆腐、根菜、そばを一度に使える温かい汁そば。'},ko:{title:'켄친소바',copy:'닭고기, 두부, 뿌리채소, 메밀국수를 한 번에 넣어 끓이는 따뜻한 국물 소바.'}},ingredients:[{label:'荞麦面',labels:{en:'soba noodles',zh:'荞麦面',ja:'そば',ko:'메밀국수'},names:['荞麦面','soba','そば','메밀국수']},{label:'鸡肉',labels:{en:'chicken',zh:'鸡肉',ja:'鶏肉',ko:'닭고기'},names:['鸡肉','chicken','鶏肉','닭고기']},{label:'豆腐',labels:{en:'tofu',zh:'豆腐',ja:'豆腐',ko:'두부'},names:['豆腐','tofu','豆腐','두부']},{label:'根茎蔬菜',labels:{en:'root vegetables',zh:'根茎蔬菜',ja:'根菜',ko:'뿌리채소'},names:['胡萝卜','白萝卜','萝卜','牛蒡','carrot','daikon','burdock','にんじん','大根','ごぼう','당근','무','우엉']}],seasonings:['soy','oil'],equipment:['saucepan'],steps:{en:['Sauté chicken and firm root vegetables in a little oil, then add water or dashi.','Simmer until the vegetables and chicken are cooked; add tofu near the end.','Season the broth with soy sauce, warm cooked soba in it, and serve while hot.'],zh:['用少量油炒鸡肉和较硬的根茎蔬菜，再加水或高汤。','煮到蔬菜和鸡肉熟透，快好时加入豆腐。','用酱油调好汤味，放入煮好的荞麦面加热后趁热食用。'],ja:['鶏肉と火の通りにくい根菜を少量の油で炒め、水またはだしを加える。','野菜と鶏肉に火が通るまで煮て、最後に豆腐を加える。','醤油で汁を調え、ゆでたそばを温めて熱いうちに食べる。'],ko:['닭고기와 단단한 뿌리채소를 기름 조금에 볶고 물 또는 다시를 넣는다.','채소와 닭고기가 익을 때까지 끓인 뒤 마지막에 두부를 넣는다.','국물을 간장으로 간하고 삶은 메밀면을 데워 뜨겁게 낸다.']}},
      {id:'japan-tofu-meshi',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/7464/index.html',translations:{en:{title:'Tofu mixed rice',copy:'A seasoned rice meal that makes a full dish from tofu, egg, peas, and cooked rice.'},zh:{title:'豆腐拌饭',copy:'豆腐、鸡蛋、豌豆和米饭可做成满足的一碗日式拌饭。'},ja:{title:'豆腐めし',copy:'豆腐、卵、豆、ご飯を使って一皿に仕上げる味付き混ぜご飯。'},ko:{title:'두부메시',copy:'두부, 달걀, 완두콩, 밥으로 한 끼를 만드는 일본식 양념 비빔밥.'}},ingredients:[{label:'米饭',labels:{en:'cooked rice',zh:'米饭',ja:'ご飯',ko:'밥'},names:['米饭','剩饭','rice','ご飯','밥']},{label:'豆腐',labels:{en:'tofu',zh:'豆腐',ja:'豆腐',ko:'두부'},names:['豆腐','tofu','豆腐','두부']},{label:'鸡蛋',labels:{en:'egg',zh:'鸡蛋',ja:'卵',ko:'달걀'},names:['鸡蛋','egg','卵','달걀']},{label:'豌豆',labels:{en:'peas',zh:'豌豆',ja:'えんどう豆',ko:'완두콩'},names:['豌豆','peas','えんどう豆','완두콩']}],seasonings:['soy','sugar','oil'],equipment:['frying_pan','saucepan'],steps:{en:['Crumble tofu and simmer it briefly with soy sauce and a little sugar until seasoned.','Scramble the egg softly and warm peas or other small vegetables.','Fold the tofu, egg, and vegetables through warm rice; adjust the seasoning before serving.'],zh:['豆腐捏碎，用酱油和少量糖稍煮至入味。','把鸡蛋炒成软嫩炒蛋，同时加热豌豆或其他小颗蔬菜。','把豆腐、鸡蛋和蔬菜拌进热米饭，上桌前按口味补调味。'],ja:['豆腐をくずし、醤油と少量の砂糖でさっと煮て味を含ませる。','卵はやわらかい炒り卵にし、えんどう豆などの小さな野菜を温める。','豆腐、卵、野菜を温かいご飯に混ぜ、味を調えて盛る。'],ko:['두부를 부숴 간장과 설탕 조금으로 잠깐 조려 간을 밴다.','달걀은 부드럽게 스크램블하고 완두콩이나 작은 채소를 데운다.','두부, 달걀, 채소를 따뜻한 밥에 섞고 간을 맞춘다.']}},
      {id:'japan-konnyaku-miso-oden',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/6525/index.html',translations:{en:{title:'Konnyaku miso oden',copy:'A simple simmered snack or side built around konnyaku and a sweet miso sauce.'},zh:{title:'味噌魔芋关东煮',copy:'魔芋搭配甜味噌酱即可完成的简单煮物小食。'},ja:{title:'こんにゃくのみそおでん',copy:'こんにゃくと甘いみそだれで作る、手軽な煮物・おやつ。'},ko:{title:'곤약 미소오뎅',copy:'곤약과 달콤한 된장 소스로 만드는 간단한 조림 간식 또는 반찬.'}},ingredients:[{label:'魔芋',labels:{en:'konnyaku',zh:'魔芋',ja:'こんにゃく',ko:'곤약'},names:['魔芋','蒟蒻','konnyaku','こんにゃく','곤약']}],seasonings:['miso','sugar','soy'],equipment:['saucepan'],steps:{en:['Cut konnyaku into bite-size pieces and simmer it in water for a few minutes to remove its aroma.','Mix miso, sugar, and a splash of soy sauce with a little cooking liquid.','Simmer or coat the konnyaku in the sauce until glossy, then serve warm.'],zh:['魔芋切成入口大小，先在水中煮几分钟去味。','味噌、糖、少量酱油和一点煮汁调成酱。','把魔芋放入酱中稍煮或裹匀，表面发亮后热食。'],ja:['こんにゃくを食べやすく切り、においを取るため数分ゆでる。','みそ、砂糖、少量の醤油とゆで汁少々を混ぜてたれにする。','こんにゃくをたれで軽く煮るか絡め、照りが出たら温かいうちに食べる。'],ko:['곤약을 먹기 좋게 썰어 냄새를 빼기 위해 물에 몇 분 데친다.','된장, 설탕, 간장 조금, 삶은 물 약간을 섞어 소스를 만든다.','곤약을 소스에 살짝 조리거나 버무려 윤기가 나면 따뜻하게 낸다.']}},
      {id:'japan-takenoko-misoni',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/7111/index.html',translations:{en:{title:'Bamboo shoots simmered in miso',copy:'A gentle spring simmer for prepared bamboo shoots and a miso pantry.'},zh:{title:'味噌炖竹笋',copy:'处理好的竹笋配味噌就能做成温和的春季日式炖菜。'},ja:{title:'たけのこのみそ煮',copy:'下ゆで済みのたけのことみそで作る、春らしいやさしい煮物。'},ko:{title:'죽순 된장조림',copy:'손질한 죽순과 된장으로 만드는 부드러운 봄철 일본식 조림.'}},ingredients:[{label:'竹笋',labels:{en:'prepared bamboo shoots',zh:'竹笋',ja:'ゆでたけのこ',ko:'손질한 죽순'},names:['竹笋','笋','bamboo shoots','ゆでたけのこ','죽순']}],seasonings:['miso','soy','sugar'],equipment:['saucepan'],steps:{en:['Use prepared bamboo shoots, or first boil fresh shoots until tender and rinse them.','Cut the shoots into pieces and simmer them in water or dashi with soy sauce and sugar.','Stir miso with a little broth, return it to the pan, and simmer gently until the flavor is absorbed.'],zh:['用处理好的竹笋；若是新鲜竹笋，先煮软并冲洗干净。','竹笋切块，加水或高汤、酱油和糖小火煮。','用少量汤汁调开味噌后倒回锅中，小火煮到入味。'],ja:['下ゆで済みのたけのこを使う。生のたけのこは、やわらかくゆでてから洗う。','たけのこを切り、水またはだし、醤油、砂糖で煮る。','みそを煮汁で溶いて鍋に戻し、味が染みるまでやさしく煮る。'],ko:['손질한 죽순을 쓰고, 생죽순이라면 먼저 부드러워질 때까지 삶아 헹군다.','죽순을 썰어 물 또는 다시, 간장, 설탕과 함께 끓인다.','된장을 국물 조금에 풀어 다시 넣고 맛이 배도록 은근히 조린다.']}},
      {id:'japan-nishin-soba',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/2473/index.html',translations:{en:{title:'Nishin soba',copy:'A Kyoto-style warm soba bowl for prepared herring, noodles, and broth.'},zh:{title:'京都鲱鱼荞麦面',copy:'买好的鲱鱼甘露煮、荞麦面和面汤可组成一碗京都风味热汤面。'},ja:{title:'にしんそば',copy:'市販のにしん甘露煮、そば、つゆで作れる京都風の温かいそば。'},ko:{title:'니신소바',copy:'시판 조림 청어, 메밀국수, 쯔유로 만드는 교토식 따뜻한 소바.'}},ingredients:[{label:'荞麦面',labels:{en:'soba noodles',zh:'荞麦面',ja:'そば',ko:'메밀국수'},names:['荞麦面','soba','そば','메밀국수']},{label:'鲱鱼甘露煮',labels:{en:'prepared simmered herring',zh:'鲱鱼甘露煮',ja:'にしん甘露煮',ko:'조림 청어'},names:['鲱鱼','鲱鱼甘露煮','herring','simmered herring','にしん','にしん甘露煮','청어']}],seasonings:['soy'],equipment:['saucepan'],steps:{en:['Warm the prepared simmered herring gently in a little of its sauce or broth.','Heat noodle broth in a saucepan and cook or warm the soba separately as needed.','Place soba in a bowl, pour over the hot broth, and set the herring on top.'],zh:['把买好的鲱鱼甘露煮连少量酱汁或高汤小火热透。','锅中加热面汤，荞麦面另煮或按包装加热。','面放进碗里，浇上热汤，再摆上鲱鱼。'],ja:['市販のにしん甘露煮は、少量のたれまたはつゆでやさしく温める。','鍋でつゆを温め、そばは必要に応じて別にゆでるか温める。','器にそばを入れて熱いつゆを注ぎ、にしんをのせる。'],ko:['시판 조림 청어를 소스나 국물 조금과 함께 약한 불에 데운다.','냄비에 쯔유를 데우고 메밀면은 필요에 따라 따로 삶거나 데운다.','그릇에 면을 담고 뜨거운 국물을 부은 뒤 청어를 올린다.']}},
      {id:'japan-peanut-miso',cuisine:'japan',sourceStatus:'verified',source:'https://www.maff.go.jp/e/policies/market/k_ryouri/search_menu/6024/index.html',translations:{en:{title:'Peanut miso',copy:'A sweet-savory peanut and miso side that keeps well for rice or vegetable bowls.'},zh:{title:'花生味噌',copy:'花生和味噌做成的咸甜小菜，可配米饭或蔬菜碗。'},ja:{title:'落花生みそ',copy:'落花生とみそで作る甘じょっぱい常備菜。ご飯や野菜に合わせやすい。'},ko:{title:'땅콩 된장무침',copy:'땅콩과 된장으로 만드는 달콤짭짤한 밑반찬으로 밥이나 채소에 잘 어울린다.'}},ingredients:[{label:'花生',labels:{en:'peanuts',zh:'花生',ja:'落花生',ko:'땅콩'},names:['花生','花生米','peanuts','落花生','땅콩']}],seasonings:['miso','sugar'],equipment:['frying_pan'],steps:{en:['Toast plain peanuts in a dry pan over low heat until fragrant, then cool them.','Warm miso and sugar with a spoonful of water in the pan until smooth.','Stir in the peanuts and cook briefly until coated; cool before storing or serving.'],zh:['原味花生放入干锅小火炒香，放凉。','锅中加味噌、糖和一勺水，小火搅匀。','倒入花生快速翻匀裹上酱，放凉后即可保存或食用。'],ja:['素焼きでない落花生は、乾いたフライパンで弱火で香りが出るまで炒り、冷ます。','フライパンにみそ、砂糖、水少々を入れ、なめらかになるまで温める。','落花生を加えて手早く絡め、冷ましてから保存または盛り付ける。'],ko:['무가당 땅콩을 마른 팬에 약불로 고소해질 때까지 볶아 식힌다.','팬에 된장, 설탕, 물 한 숟갈을 넣고 부드러워질 때까지 데운다.','땅콩을 넣어 짧게 버무린 뒤 식혀 보관하거나 낸다.']}}

    const japaneseIzakayaRecipes=[
      {id:'japan-yakitori-negima',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/yakitori/',translations:{en:{title:'Chicken and scallion yakitori',copy:'A classic izakaya skewer for chicken and green onion, made under a broiler or in a pan.'},zh:{title:'葱鸡肉串',copy:'鸡肉和葱可用烤箱上火或平底锅做成经典居酒屋烤串。'},ja:{title:'ねぎま焼き鳥',copy:'鶏肉とねぎを、グリルやフライパンで作る定番の居酒屋串。'},ko:{title:'네기마 야키토리',copy:'닭고기와 대파를 오븐 그릴이나 팬으로 만드는 대표적인 이자카야 꼬치.'}},ingredients:[{label:'鸡肉',labels:{en:'chicken thigh',zh:'鸡肉',ja:'鶏もも肉',ko:'닭다리살'},names:['鸡肉','鸡腿肉','chicken','chicken thigh','鶏肉','鶏もも肉','닭고기','닭다리살']},{label:'葱',labels:{en:'scallion',zh:'葱',ja:'ねぎ',ko:'대파'},names:['葱','大葱','scallion','green onion','ねぎ','대파']}],seasonings:['soy','sugar','oil'],equipment:['frying_pan','oven'],steps:{en:['Cut chicken and scallion into similar pieces, then thread them alternately onto skewers or keep them loose for a pan.','Cook under a hot broiler or in a lightly oiled pan, turning until the chicken is cooked through.','Brush with a reduced soy-and-sugar sauce during the last minutes, then serve hot.'],zh:['鸡肉和葱切成相近大小，交替串到竹签上；没有签子可直接下锅。','烤箱上火烤或少油平底锅煎，期间翻面至鸡肉熟透。','最后几分钟刷上酱油和糖收浓的酱汁，趁热吃。'],ja:['鶏肉とねぎを同じくらいに切り、交互に串に刺す。串がなければそのまま焼く。','強火のグリルか少量の油をひいたフライパンで、鶏肉に火が通るまで返しながら焼く。','仕上げに醤油と砂糖を煮詰めたたれを塗り、熱いうちに出す。'],ko:['닭고기와 대파를 비슷한 크기로 썰어 번갈아 꼬치에 끼우고, 꼬치가 없으면 그대로 굽는다.','센 오븐 그릴이나 기름을 조금 두른 팬에서 닭고기가 익을 때까지 뒤집어 굽는다.','마지막 몇 분에 간장과 설탕을 졸인 소스를 발라 뜨겁게 낸다.']}},
      {id:'japan-karaage',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/karaage/',translations:{en:{title:'Karaage fried chicken',copy:'Juicy Japanese fried chicken: a popular bento item and a satisfying beer snack.'},zh:{title:'日式炸鸡块',copy:'多汁的日式炸鸡块，适合便当，也很适合配啤酒。'},ja:{title:'鶏の唐揚げ',copy:'お弁当の定番で、お酒のおつまみにもなるジューシーな鶏の唐揚げ。'},ko:{title:'일본식 가라아게',copy:'도시락 단골 메뉴이자 맥주 안주로도 좋은 촉촉한 일본식 닭튀김.'}},ingredients:[{label:'鸡肉',labels:{en:'boneless chicken thigh',zh:'去骨鸡腿肉',ja:'鶏もも肉',ko:'뼈 없는 닭다리살'},names:['鸡肉','鸡腿肉','chicken','chicken thigh','鶏肉','鶏もも肉','닭고기','닭다리살']},{label:'姜',labels:{en:'ginger',zh:'姜',ja:'しょうが',ko:'생강'},names:['姜','生姜','ginger','しょうが','생강']}],seasonings:['soy','oil'],equipment:['frying_pan'],steps:{en:['Cut chicken into bite-size pieces and coat it with soy sauce and grated ginger; rest briefly.','Dust the pieces with potato starch or flour immediately before frying.','Fry in oil until crisp and fully cooked, drain well, and serve with lemon if available.'],zh:['鸡肉切成小块，拌入酱油和姜末，稍微腌一会儿。','下锅前马上裹上土豆淀粉或面粉。','油炸至外脆内熟，充分沥油；有柠檬可一起上桌。'],ja:['鶏肉を一口大に切り、醤油とすりおろししょうがを絡めて少し置く。','揚げる直前に片栗粉または小麦粉をまぶす。','油でカリッと中まで揚げ、よく油を切って、あればレモンを添える。'],ko:['닭고기를 한입 크기로 잘라 간장과 간 생강에 버무려 잠시 둔다.','튀기기 직전에 감자전분이나 밀가루를 묻힌다.','기름에 바삭하고 속까지 익도록 튀긴 뒤 기름을 빼고, 있으면 레몬을 곁들인다.']}},
      {id:'japan-agedashi-tofu',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/agedashi-tofu-2/',translations:{en:{title:'Agedashi tofu',copy:'Crisp-coated tofu with a warm soy broth: a familiar izakaya starter.'},zh:{title:'日式炸豆腐',copy:'外脆里嫩的豆腐浇上温热酱油汤，是常见的居酒屋前菜。'},ja:{title:'揚げ出し豆腐',copy:'カリッと揚げた豆腐に温かいつゆをかける、居酒屋の定番前菜。'},ko:{title:'아게다시두부',copy:'바삭하게 튀긴 두부에 따뜻한 간장 국물을 곁들이는 이자카야 대표 안주.'}},ingredients:[{label:'豆腐',labels:{en:'medium-firm tofu',zh:'老豆腐',ja:'木綿豆腐',ko:'단단한 두부'},names:['豆腐','老豆腐','tofu','firm tofu','木綿豆腐','두부']},{label:'白萝卜',labels:{en:'daikon radish',zh:'白萝卜',ja:'大根',ko:'무'},names:['白萝卜','萝卜','daikon','大根','무']}],seasonings:['soy','oil'],equipment:['frying_pan','saucepan'],steps:{en:['Drain tofu briefly, cut it into large cubes, and coat the surface with potato starch.','Shallow-fry or deep-fry until the outside is pale golden and crisp.','Warm a light soy broth, pour it around the tofu, and top with grated daikon and scallion if available.'],zh:['豆腐稍微沥水后切大块，表面裹上土豆淀粉。','浅炸或油炸至外层浅金黄、发脆。','加热清淡酱油汤，浇在豆腐周围；有的话加萝卜泥和葱花。'],ja:['豆腐の水気を軽く切って大きめに切り、表面に片栗粉をまぶす。','表面が薄いきつね色でカリッとするまで揚げるか、多めの油で焼く。','薄味のつゆを温めて豆腐の周りに注ぎ、あれば大根おろしとねぎをのせる。'],ko:['두부의 물기를 가볍게 빼고 큼직하게 썰어 표면에 감자전분을 묻힌다.','겉이 연한 황금색으로 바삭해질 때까지 튀기거나 기름을 넉넉히 두르고 굽는다.','연한 간장 국물을 데워 두부 주변에 붓고, 있으면 간 무와 파를 올린다.']}},
      {id:'japan-cucumber-sunomono',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/sunomono-with-cucumber-and-wakame/',translations:{en:{title:'Cucumber sunomono',copy:'A cool sweet-and-sour cucumber side that balances rich fried or grilled snacks.'},zh:{title:'日式醋拌黄瓜',copy:'清凉酸甜的黄瓜小菜，适合搭配油炸或烧烤类下酒菜。'},ja:{title:'きゅうりの酢の物',copy:'揚げ物や焼き物の合間に合う、さっぱり甘酢のきゅうり小鉢。'},ko:{title:'오이 초무침',copy:'튀김이나 구이 안주 사이에 곁들이기 좋은 새콤달콤한 오이 반찬.'}},ingredients:[{label:'黄瓜',labels:{en:'cucumber',zh:'黄瓜',ja:'きゅうり',ko:'오이'},names:['黄瓜','cucumber','きゅうり','오이']},{label:'裙带菜',labels:{en:'dried wakame',zh:'干裙带菜',ja:'乾燥わかめ',ko:'건미역'},names:['裙带菜','海带芽','wakame','乾燥わかめ','미역']}],seasonings:['vinegar','sugar','salt','soy'],equipment:[],steps:{en:['Soak dried wakame in water if using it, and thinly slice the cucumber.','Salt the cucumber for a few minutes, then squeeze away its excess water.','Toss cucumber and wakame with vinegar, sugar, a pinch of salt, and a little soy sauce; chill before serving.'],zh:['若使用干裙带菜先用水泡开，黄瓜切薄片。','黄瓜撒盐静置几分钟，再挤掉多余水分。','将黄瓜和裙带菜拌入醋、糖、少量盐和一点酱油，冷藏后食用。'],ja:['乾燥わかめを使う場合は水で戻し、きゅうりは薄切りにする。','きゅうりに塩をして数分置き、出た水分をしぼる。','きゅうりとわかめを酢、砂糖、塩少々、醤油少々で和え、冷やして出す。'],ko:['건미역을 쓸 때는 물에 불리고, 오이는 얇게 썬다.','오이에 소금을 뿌려 몇 분 두었다가 나온 물기를 짠다.','오이와 미역을 식초, 설탕, 소금 약간, 간장 조금에 무쳐 차게 낸다.']}},
      {id:'japan-asazuke',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/asazuke/',translations:{en:{title:'Quick Japanese pickled vegetables',copy:'An hour-long light pickle for cabbage, cucumber, daikon, or carrot.'},zh:{title:'日式快速浅渍',copy:'包菜、黄瓜、白萝卜或胡萝卜都能在约一小时内做成的轻腌小菜。'},ja:{title:'浅漬け',copy:'キャベツ、きゅうり、大根、にんじんなどを約一時間で作る手軽な浅漬け。'},ko:{title:'일본식 아사즈케',copy:'양배추, 오이, 무, 당근 등을 약 한 시간에 가볍게 절이는 간단한 일본식 절임.'}},ingredients:[{label:'蔬菜',labels:{en:'crisp vegetables',zh:'脆口蔬菜',ja:'歯ごたえのある野菜',ko:'아삭한 채소'},names:['包菜','黄瓜','白萝卜','胡萝卜','cabbage','cucumber','daikon','carrot','キャベツ','きゅうり','大根','にんじん','양배추','오이','무','당근']}],seasonings:['salt','sugar','oil'],equipment:[],steps:{en:['Cut the vegetables into thin, bite-size pieces and massage them with salt.','Add a small pinch of sugar and, if liked, a few drops of oil; place a plate or weight on top.','Refrigerate for about an hour, squeeze off released water, and serve chilled.'],zh:['脆口蔬菜切成小块或薄片，拌盐轻轻抓匀。','加少量糖，喜欢的话滴几滴油，再用盘子或重物压住。','冷藏约一小时，挤掉渗出的水分后冰凉食用。'],ja:['野菜を食べやすい薄切りにし、塩をまぶして軽くもむ。','砂糖を少量加え、好みで油を数滴たらし、皿や重しをのせる。','約一時間冷蔵し、出た水分をしぼって冷たいうちに出す。'],ko:['아삭한 채소를 얇고 먹기 좋게 썰어 소금을 뿌리고 가볍게 주무른다.','설탕을 조금 넣고 취향에 따라 기름 몇 방울을 더한 뒤 접시나 무게로 누른다.','약 한 시간 냉장한 후 나온 물을 짜내고 차게 낸다.']}},
      {id:'japan-nasu-dengaku',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/miso-dengaku/',translations:{en:{title:'Miso-glazed eggplant',copy:'A sweet-savory eggplant small plate with a deeply browned miso topping.'},zh:{title:'味噌烤茄子',copy:'茄子涂上咸甜味噌酱烤香，是很下酒的一道小菜。'},ja:{title:'なす田楽',copy:'なすに甘じょっぱいみそをのせて香ばしく焼く、お酒にも合う小鉢。'},ko:{title:'가지 미소덴가쿠',copy:'가지에 달콤짭짤한 된장을 올려 노릇하게 굽는 술안주 반찬.'}},ingredients:[{label:'茄子',labels:{en:'eggplant',zh:'茄子',ja:'なす',ko:'가지'},names:['茄子','eggplant','なす','가지']}],seasonings:['miso','sugar','oil'],equipment:['frying_pan','oven'],steps:{en:['Halve eggplants, score the flesh, and brush the cut sides lightly with oil.','Pan-cook or broil until the flesh is tender.','Mix miso with sugar and a little water, spread it over the eggplant, then broil again until fragrant.'],zh:['茄子对半切开，在果肉划格子，切面刷少量油。','平底锅煎或烤箱上火烤到果肉变软。','味噌、糖和一点水调成酱，抹在茄子上，再烤到香味出来。'],ja:['なすを縦半分に切り、果肉に切り目を入れて切り口に少量の油を塗る。','フライパンまたはグリルで果肉がやわらかくなるまで焼く。','みそ、砂糖、水少々を混ぜて塗り、香りが立つまで再び焼く。'],ko:['가지를 세로로 반 갈라 속살에 칼집을 내고 자른 면에 기름을 조금 바른다.','팬이나 오븐 그릴에서 속이 부드러워질 때까지 굽는다.','된장, 설탕, 물 약간을 섞어 바른 뒤 향이 날 때까지 다시 굽는다.']}},
      {id:'japan-dashimaki-tamago',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/dashimaki-tamago/',translations:{en:{title:'Dashi rolled omelette',copy:'A tender rolled omelette with broth, popular in bento and at izakaya counters.'},zh:{title:'高汤玉子烧',copy:'加入高汤的软嫩玉子烧，便当和居酒屋柜台都很常见。'},ja:{title:'だし巻き玉子',copy:'だしを含ませたやわらかい卵焼き。お弁当にも居酒屋にも定番。'},ko:{title:'다시마키 타마고',copy:'다시를 넣어 부드럽게 말아 만든 달걀말이로 도시락과 이자카야에서 모두 인기다.'}},ingredients:[{label:'鸡蛋',labels:{en:'eggs',zh:'鸡蛋',ja:'卵',ko:'달걀'},names:['鸡蛋','egg','eggs','卵','달걀']}],seasonings:['soy','sugar','oil','salt'],equipment:['frying_pan'],steps:{en:['Whisk eggs with cooled dashi or water, a little soy sauce, sugar, and salt.','Pour in a thin layer in an oiled pan and roll it up when just set.','Move the roll aside, add another thin layer, and keep rolling until all egg is used; rest briefly before slicing.'],zh:['鸡蛋加放凉的高汤或水、少量酱油、糖和盐打匀。','抹油平底锅倒一层薄蛋液，刚凝固就卷起。','把蛋卷推到一侧，再倒薄蛋液，反复卷到用完；稍放凉再切。'],ja:['卵に冷ましただしまたは水、少量の醤油、砂糖、塩を混ぜる。','油をひいたフライパンに薄く流し、固まりかけたら巻く。','巻いた卵を端に寄せ、次の薄い卵液を流して繰り返し、少し休ませてから切る。'],ko:['달걀에 식힌 다시 또는 물, 간장 조금, 설탕, 소금을 섞는다.','기름 두른 팬에 얇게 붓고 막 익기 시작하면 만다.','말아 둔 달걀을 한쪽으로 밀고 새 달걀물을 얇게 부어 반복한 뒤 잠시 둔 다음 썬다.']}},
      {id:'japan-ajitsuke-tamago',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/ramen-egg/',translations:{en:{title:'Soy-marinated ramen eggs',copy:'A make-ahead soft egg snack for ramen, rice bowls, and drinks.'},zh:{title:'日式酱油溏心蛋',copy:'可以提前做好的酱油溏心蛋，适合拉面、盖饭或当下酒菜。'},ja:{title:'味付け玉子',copy:'作り置きできる半熟の味付け卵。ラーメン、丼、おつまみに便利。'},ko:{title:'아지타마',copy:'미리 만들어 둘 수 있는 반숙 간장 달걀로 라멘, 덮밥, 술안주에 잘 어울린다.'}},ingredients:[{label:'鸡蛋',labels:{en:'eggs',zh:'鸡蛋',ja:'卵',ko:'달걀'},names:['鸡蛋','egg','eggs','卵','달걀']}],seasonings:['soy','sugar'],equipment:['saucepan'],steps:{en:['Lower eggs into simmering water and cook only until the yolks are as soft as you like, then chill in ice water.','Peel carefully and place the eggs in a small container with soy sauce, sugar, and water.','Refrigerate for several hours or overnight, turning once if the eggs are not fully covered; halve to serve.'],zh:['鸡蛋放入微沸水中煮到喜欢的溏心程度，马上放进冰水。','小心剥壳，放入小盒中，加酱油、糖和水。','冷藏数小时或过夜；若酱汁没完全盖住，中途翻一次，吃时对半切开。'],ja:['卵を静かに湯に入れ、好みの半熟加減までゆでたら氷水で冷やす。','殻をむいて小さな容器に入れ、醤油、砂糖、水を加える。','数時間から一晩冷蔵し、汁に浸かり切らない場合は途中で返す。半分に切って出す。'],ko:['달걀을 잔잔히 끓는 물에 넣어 원하는 반숙 정도로 삶고 얼음물에 식힌다.','조심스럽게 껍질을 벗겨 작은 용기에 넣고 간장, 설탕, 물을 붓는다.','몇 시간 또는 하룻밤 냉장하고, 국물에 다 잠기지 않으면 중간에 한 번 뒤집어 반으로 잘라 낸다.']}}

    const japaneseBentoAndBarRecipes=[
      {id:'japan-kinpira-gobo',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/kinpira-gobo/',translations:{en:{title:'Kinpira gobo',copy:'A soy-sweet burdock and carrot stir-fry that works as a make-ahead bento side or bar snack.'},zh:{title:'日式金平牛蒡',copy:'牛蒡和胡萝卜炒成咸甜小菜，可提前做进便当，也适合下酒。'},ja:{title:'きんぴらごぼう',copy:'ごぼうとにんじんを甘辛く炒め煮する、作り置きやおつまみに便利な副菜。'},ko:{title:'킨피라 고보',copy:'우엉과 당근을 달콤짭짤하게 볶아 조리는 반찬으로 도시락이나 술안주에 좋다.'}},ingredients:[{label:'牛蒡',labels:{en:'burdock root',zh:'牛蒡',ja:'ごぼう',ko:'우엉'},names:['牛蒡','burdock','burdock root','ごぼう','우엉']},{label:'胡萝卜',labels:{en:'carrot',zh:'胡萝卜',ja:'にんじん',ko:'당근'},names:['胡萝卜','carrot','にんじん','당근']}],seasonings:['soy','sugar','oil'],equipment:['frying_pan'],steps:{en:['Cut burdock and carrot into thin matchsticks; briefly soak burdock in water if it is very astringent.','Stir-fry in a little oil until the vegetables begin to soften.','Add soy sauce and sugar, cook until the liquid is nearly gone, then cool before packing or serving.'],zh:['牛蒡和胡萝卜切细丝；牛蒡涩味重可短暂泡水。','少油翻炒到蔬菜开始变软。','加入酱油和糖，炒到汁液几乎收干；放凉后装便当或上桌。'],ja:['ごぼうとにんじんを細切りにし、えぐみが強ければごぼうだけを短時間水にさらす。','少量の油で野菜が少ししんなりするまで炒める。','醤油と砂糖を加え、汁気がほぼなくなるまで炒め、冷ましてから詰めるか出す。'],ko:['우엉과 당근을 가늘게 채 썰고, 떫은맛이 강하면 우엉만 잠시 물에 담근다.','기름을 조금 두르고 채소가 살짝 부드러워질 때까지 볶는다.','간장과 설탕을 넣어 물기가 거의 없어질 때까지 볶고 식혀 도시락에 담거나 낸다.']}},
      {id:'japan-kinpira-renkon',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/kinpira-renkon/',translations:{en:{title:'Kinpira lotus root',copy:'A crisp lotus-root stir-fry with a glossy soy glaze for bento or drinks.'},zh:{title:'日式金平莲藕',copy:'爽脆莲藕裹上酱油甜汁，适合便当也适合当下酒小菜。'},ja:{title:'きんぴられんこん',copy:'れんこんの歯ごたえを楽しむ甘辛炒め。お弁当にもおつまみにも合う。'},ko:{title:'킨피라 연근',copy:'아삭한 연근을 달콤짭짤하게 볶는 반찬으로 도시락과 술안주에 모두 잘 어울린다.'}},ingredients:[{label:'莲藕',labels:{en:'lotus root',zh:'莲藕',ja:'れんこん',ko:'연근'},names:['莲藕','lotus root','れんこん','연근']}],seasonings:['soy','sugar','oil'],equipment:['frying_pan'],steps:{en:['Peel lotus root if needed, slice it thinly, and rinse the slices quickly in water.','Stir-fry in oil until the edges turn translucent and the slices remain crisp.','Add soy sauce and sugar, toss until glazed, and serve warm or at room temperature.'],zh:['莲藕按需去皮切薄片，再快速冲水。','油炒至边缘变半透明但仍保持脆感。','加入酱油和糖翻炒至裹上亮汁，温热或常温食用。'],ja:['れんこんは必要なら皮をむき、薄切りにしてさっと水にさらす。','油で縁が透き通るまで炒め、歯ごたえは残す。','醤油と砂糖を加えて照りが出るまで絡め、温かくても常温でも出す。'],ko:['연근은 필요하면 껍질을 벗겨 얇게 썰고 물에 잠깐 헹군다.','기름에 가장자리가 투명해질 때까지 볶되 아삭함은 남긴다.','간장과 설탕을 넣어 윤기가 나게 버무리고 따뜻하거나 실온으로 낸다.']}},
      {id:'japan-chikuwa-isobeage',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/everyday/bento/',translations:{en:{title:'Chikuwa seaweed fritters',copy:'Fish-cake rings in a nori-flavored batter: a quick freezer-friendly bento side.'},zh:{title:'海苔竹轮天妇罗',copy:'竹轮裹上海苔面糊炸香，是适合冷冻备餐的便当小菜。'},ja:{title:'ちくわの磯辺揚げ',copy:'ちくわに青のり入りの衣を付けて揚げる、冷凍作り置きもしやすいお弁当おかず。'},ko:{title:'치쿠와 김튀김',copy:'어묵 치쿠와에 김가루 반죽을 입혀 튀기는 도시락용 반찬으로 냉동 보관도 편하다.'}},ingredients:[{label:'竹轮',labels:{en:'chikuwa fish cakes',zh:'竹轮鱼糕',ja:'ちくわ',ko:'치쿠와 어묵'},names:['竹轮','鱼糕','chikuwa','fish cakes','ちくわ','치쿠와']}],seasonings:['oil','salt'],equipment:['frying_pan'],steps:{en:['Cut chikuwa into short pieces or strips.','Make a light flour-and-water batter with seaweed flakes if available, then coat the chikuwa.','Fry in shallow oil until the coating is crisp, drain, and serve warm or cool for bento.'],zh:['竹轮切短段或切条。','面粉和水调成轻薄面糊；有海苔碎可拌入，再裹上竹轮。','浅油炸到外衣变脆，沥油后趁热吃或放凉装便当。'],ja:['ちくわを短く切るか、縦に切る。','小麦粉と水で軽い衣を作り、あれば青のりを混ぜてちくわに付ける。','少なめの油で衣がカリッとするまで揚げ、油を切って温かく、または冷まして詰める。'],ko:['치쿠와를 짧게 또는 길게 썬다.','밀가루와 물로 묽은 반죽을 만들고, 있으면 김가루를 섞어 치쿠와에 입힌다.','기름을 얕게 두르고 튀겨 옷이 바삭해지면 기름을 빼고 따뜻하게 또는 식혀 도시락에 넣는다.']}},
      {id:'japan-potato-salad',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/everyday/bento/',translations:{en:{title:'Japanese potato salad',copy:'A creamy potato, cucumber, and egg salad that is a familiar bento and izakaya side.'},zh:{title:'日式土豆沙拉',copy:'土豆、黄瓜和鸡蛋做成绵密沙拉，是便当和居酒屋常见配菜。'},ja:{title:'ポテトサラダ',copy:'じゃがいも、きゅうり、卵で作る、居酒屋やお弁当でおなじみのなめらかなサラダ。'},ko:{title:'일본식 감자샐러드',copy:'감자, 오이, 달걀로 만드는 부드러운 샐러드로 도시락과 이자카야의 친숙한 곁들임이다.'}},ingredients:[{label:'土豆',labels:{en:'potatoes',zh:'土豆',ja:'じゃがいも',ko:'감자'},names:['土豆','马铃薯','potato','potatoes','じゃがいも','감자']},{label:'黄瓜',labels:{en:'cucumber',zh:'黄瓜',ja:'きゅうり',ko:'오이'},names:['黄瓜','cucumber','きゅうり','오이']},{label:'鸡蛋',labels:{en:'eggs',zh:'鸡蛋',ja:'卵',ko:'달걀'},names:['鸡蛋','egg','eggs','卵','달걀']}],seasonings:['salt','pepper'],equipment:['saucepan'],steps:{en:['Boil potatoes until tender and hard-boil the eggs; cool both enough to handle.','Salt sliced cucumber briefly and squeeze out the water, then mash the potatoes while still warm.','Fold in chopped egg, cucumber, and mayonnaise or a creamy dressing; chill before serving.'],zh:['土豆煮软，鸡蛋煮成全熟，稍放凉到可拿取。','黄瓜片撒盐静置后挤水；土豆趁温热压成粗泥。','拌入切碎鸡蛋、黄瓜和蛋黄酱或奶油沙拉酱，冷藏后食用。'],ja:['じゃがいもをやわらかくゆで、卵は固ゆでにして、触れる温度まで冷ます。','薄切りきゅうりは塩をして水気をしぼり、じゃがいもは温かいうちに粗くつぶす。','刻んだ卵、きゅうり、マヨネーズなどのクリーミーなドレッシングを混ぜ、冷やして出す。'],ko:['감자는 부드럽게 삶고 달걀은 완숙으로 삶아 만질 수 있을 만큼 식힌다.','얇게 썬 오이에 소금을 뿌렸다가 물기를 짜고, 감자는 따뜻할 때 거칠게 으깬다.','다진 달걀, 오이, 마요네즈 또는 크리미한 드레싱을 섞어 차게 낸다.']}},
      {id:'japan-miso-yaki-onigiri',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/miso-yaki-onigiri/',translations:{en:{title:'Miso grilled rice balls',copy:'A fragrant crisp-edged rice ball with miso, perfect for using leftover rice as a snack.'},zh:{title:'味噌烤饭团',copy:'剩米饭涂味噌煎烤到边缘香脆，就是方便的日式小食。'},ja:{title:'みそ焼きおにぎり',copy:'残りご飯にみそを塗って香ばしく焼く、手軽な焼きおにぎり。'},ko:{title:'된장 구운 주먹밥',copy:'남은 밥에 된장을 발라 가장자리가 바삭해지도록 굽는 간편한 일본식 간식.'}},ingredients:[{label:'米饭',labels:{en:'cooked rice',zh:'米饭',ja:'ご飯',ko:'밥'},names:['米饭','剩饭','rice','cooked rice','ご飯','밥']}],seasonings:['miso','sugar','oil'],equipment:['frying_pan','oven'],steps:{en:['Shape warm rice into firm balls or triangles and let the surface dry for a few minutes.','Pan-grill or broil both sides until a light crust forms.','Mix miso with a little sugar, spread it on each side, and grill again just until fragrant.'],zh:['把温热米饭捏成紧实圆形或三角形，表面放几分钟晾干。','平底锅煎或烤箱上火烤至两面形成薄脆壳。','味噌加少量糖调匀，抹在饭团两面，再烤到有香味即可。'],ja:['温かいご飯をしっかり丸形または三角形に握り、表面を数分乾かす。','フライパンまたはグリルで両面に薄い焼き色が付くまで焼く。','みそに少量の砂糖を混ぜて両面に塗り、香りが立つまでさっと再び焼く。'],ko:['따뜻한 밥을 단단한 동그라미나 삼각형으로 빚고 표면을 몇 분 말린다.','팬이나 오븐 그릴에서 양면에 얇은 바삭한 층이 생길 때까지 굽는다.','된장에 설탕을 조금 섞어 양면에 바르고 향이 날 때까지만 다시 굽는다.']}},
      {id:'japan-niku-miso',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/everyday/bento/',translations:{en:{title:'All-purpose miso meat sauce',copy:'A savory minced-meat miso topping for rice, noodles, lettuce wraps, or a small drink snack.'},zh:{title:'万能肉味噌',copy:'肉末炒成浓香味噌酱，可拌饭、拌面、包生菜或直接当小菜。'},ja:{title:'万能肉みそ',copy:'ご飯、麺、レタス包み、おつまみにも使える、ひき肉のみその常備だれ。'},ko:{title:'만능 고기 된장볶음',copy:'밥, 면, 상추쌈, 술안주에 두루 쓸 수 있는 다진 고기 된장 소스.'}},ingredients:[{label:'肉末',labels:{en:'minced meat',zh:'肉末',ja:'ひき肉',ko:'다진 고기'},names:['肉末','猪肉末','鸡肉末','minced meat','ground meat','ひき肉','다진 고기']}],seasonings:['miso','soy','sugar','oil'],equipment:['frying_pan'],steps:{en:['Heat a little oil and break up minced meat in the pan until no pink remains.','Stir in miso, soy sauce, sugar, and a splash of water.','Cook over low heat until thick and glossy; spoon over rice or cool and store for later.'],zh:['锅中加少量油，把肉末炒散到没有生色。','加入味噌、酱油、糖和一点水。','小火收至浓稠发亮，浇在米饭上或放凉保存以后用。'],ja:['少量の油を熱し、ひき肉をほぐして色が変わるまで炒める。','みそ、醤油、砂糖、水少々を加える。','弱火でとろみと照りが出るまで煮詰め、ご飯にのせるか冷まして保存する。'],ko:['기름을 조금 두르고 다진 고기를 풀어가며 붉은 기가 없어질 때까지 볶는다.','된장, 간장, 설탕, 물 약간을 넣는다.','약불에서 걸쭉하고 윤기가 날 때까지 조려 밥에 올리거나 식혀 보관한다.']}},
      {id:'japan-salted-edamame',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/everyday/bento/',translations:{en:{title:'Salted edamame',copy:'The simplest cold beer snack: tender edamame with a generous salt finish.'},zh:{title:'盐水毛豆',copy:'煮软后撒足盐的毛豆，是最简单也最经典的冰啤酒搭档。'},ja:{title:'塩ゆで枝豆',copy:'やわらかくゆでてしっかり塩を振る、冷たいビールの定番おつまみ。'},ko:{title:'소금 삶은 에다마메',copy:'부드럽게 삶아 소금을 넉넉히 뿌리는 가장 간단하고 클래식한 맥주 안주.'}},ingredients:[{label:'毛豆',labels:{en:'edamame',zh:'毛豆',ja:'枝豆',ko:'에다마메'},names:['毛豆','edamame','枝豆','에다마메']}],seasonings:['salt'],equipment:['saucepan'],steps:{en:['Rinse edamame in their pods and rub them with some salt to clean the surface.','Boil in well-salted water until the beans are tender but still bright green.','Drain without rinsing, scatter with a little more salt, and serve warm or chilled.'],zh:['带壳毛豆洗净，用一些盐揉搓表面。','放进加足盐的水里煮到豆子变软但仍翠绿。','捞出不冲水，再撒少量盐，温热或冰镇食用。'],ja:['さや付き枝豆を洗い、塩少々でもんで表面をきれいにする。','塩をしっかり入れた湯で、豆がやわらかく鮮やかな緑色のうちにゆでる。','水にさらさずに湯を切り、さらに少量の塩を振って温かくても冷たくても出す。'],ko:['꼬투리째 에다마메를 씻고 소금 조금으로 문질러 표면을 씻는다.','소금을 넉넉히 넣은 물에 콩이 부드럽지만 초록색일 때까지 삶는다.','찬물에 헹구지 말고 물기를 뺀 뒤 소금을 조금 더 뿌려 따뜻하거나 차게 낸다.']}},
      {id:'japan-sesame-oil-broccoli',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/everyday/bento/',translations:{en:{title:'Broccoli with salt and sesame oil',copy:'A ten-minute green side for bento, drinks, or a quick vegetable top-up.'},zh:{title:'盐香油西兰花',copy:'十分钟就能完成的西兰花小菜，可放便当、配酒或快速补充蔬菜。'},ja:{title:'ブロッコリーの塩ごま油ゆで',copy:'お弁当、おつまみ、野菜をもう一品に便利な十分副菜。'},ko:{title:'브로콜리 소금 참기름무침',copy:'도시락, 술안주, 빠른 채소 한 가지에 좋은 10분 브로콜리 반찬.'}},ingredients:[{label:'西兰花',labels:{en:'broccoli',zh:'西兰花',ja:'ブロッコリー',ko:'브로콜리'},names:['西兰花','broccoli','ブロッコリー','브로콜리']}],seasonings:['salt','oil'],equipment:['saucepan'],steps:{en:['Cut broccoli into even florets and rinse them well.','Boil or steam just until bright green and tender-crisp, then drain thoroughly.','Toss while warm with salt and a small amount of sesame oil; cool for bento or serve warm.'],zh:['西兰花切成大小均匀的小朵并洗净。','煮或蒸到翠绿、刚好脆嫩，充分沥水。','趁温热拌盐和少量香油；放凉装便当或温热上桌。'],ja:['ブロッコリーをそろった小房に分け、よく洗う。','色鮮やかで歯ごたえが残る程度にゆでるか蒸し、水気をよく切る。','温かいうちに塩と少量のごま油で和え、お弁当用には冷ましてから詰める。'],ko:['브로콜리를 비슷한 크기의 송이로 나누어 깨끗이 씻는다.','선명한 초록색을 유지하며 아삭하게 삶거나 찐 뒤 물기를 잘 뺀다.','따뜻할 때 소금과 참기름 조금에 버무려 도시락용이면 식혀 담거나 바로 낸다.']}}

    const japaneseQuickMealRecipes=[
      {id:'japan-tamago-sando',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/everyday/bento/',translations:{en:{title:'Japanese egg salad sandwich',copy:'A convenience-store-style sandwich that turns hard-boiled eggs and bread into a quick meal.'},zh:{title:'日式鸡蛋三明治',copy:'煮鸡蛋和面包就能做成便利店风味的快速一餐。'},ja:{title:'たまごサンド',copy:'ゆで卵とパンで作る、コンビニ風の手軽な一食。'},ko:{title:'일본식 계란 샌드위치',copy:'삶은 달걀과 식빵으로 만드는 편의점 스타일의 빠른 한 끼.'}},ingredients:[{label:'鸡蛋',labels:{en:'hard-boiled eggs',zh:'熟鸡蛋',ja:'ゆで卵',ko:'삶은 달걀'},names:['鸡蛋','熟鸡蛋','egg','eggs','ゆで卵','달걀']},{label:'面包',labels:{en:'soft sandwich bread',zh:'吐司面包',ja:'食パン',ko:'식빵'},names:['面包','吐司','bread','sandwich bread','食パン','식빵']}],seasonings:['salt','pepper'],equipment:['saucepan'],steps:{en:['Hard-boil the eggs, cool them, and chop or mash them to your preferred texture.','Mix with mayonnaise or another creamy dressing, plus a little salt and pepper.','Spread generously between soft bread slices, trim if desired, and cut just before serving.'],zh:['鸡蛋煮全熟后放凉，切碎或压成喜欢的粗细。','拌入蛋黄酱或其他奶油沙拉酱，再加一点盐和胡椒。','厚厚夹进软吐司中；按喜好切边，上桌前切开。'],ja:['卵を固ゆでにして冷まし、好みの粗さに刻むかつぶす。','マヨネーズなどのクリーミーなドレッシング、塩、こしょう少々と混ぜる。','やわらかい食パンにたっぷりはさみ、好みで耳を落として食べる直前に切る。'],ko:['달걀을 완숙으로 삶아 식힌 뒤 원하는 식감으로 다지거나 으깬다.','마요네즈 또는 크리미한 드레싱, 소금과 후추 약간을 섞는다.','부드러운 식빵 사이에 넉넉히 넣고, 원하면 테두리를 자른 뒤 먹기 직전에 자른다.']}},
      {id:'japan-yaki-onigiri-chazuke',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/yaki-onigiri-chazuke/',translations:{en:{title:'Grilled rice ball chazuke',copy:'A warm bowl that revives a frozen or leftover grilled rice ball with quick broth.'},zh:{title:'烤饭团茶泡饭',copy:'冷冻或剩下的烤饭团加上一碗快速高汤，就能变成温暖的一餐。'},ja:{title:'焼きおにぎり茶漬け',copy:'冷凍や残りの焼きおにぎりを、手軽なだしで温かい一杯にする料理。'},ko:{title:'구운 주먹밥 차즈케',copy:'냉동 또는 남은 구운 주먹밥에 빠른 육수를 부어 따뜻한 한 그릇으로 만드는 요리.'}},ingredients:[{label:'烤饭团',labels:{en:'grilled rice ball',zh:'烤饭团',ja:'焼きおにぎり',ko:'구운 주먹밥'},names:['饭团','烤饭团','rice ball','grilled rice ball','おにぎり','焼きおにぎり','주먹밥']},{label:'葱',labels:{en:'scallion',zh:'葱',ja:'ねぎ',ko:'대파'},names:['葱','大葱','scallion','green onion','ねぎ','대파']}],seasonings:['soy','salt'],equipment:['frying_pan','saucepan','microwave'],steps:{en:['Reheat a prepared grilled rice ball in a pan, oven, or microwave until warm in the center.','Make a quick light broth with water or dashi, soy sauce, and a small pinch of salt.','Put the rice ball in a bowl, pour broth around it, and top with scallion or seaweed if available.'],zh:['把现成烤饭团用平底锅、烤箱或微波炉加热到中心温热。','用水或高汤、酱油和一小撮盐调成快速清汤。','饭团放进碗中，倒入汤汁；有的话加葱花或海苔。'],ja:['市販または作り置きの焼きおにぎりを、フライパン、オーブン、電子レンジで中まで温める。','水またはだしに醤油と塩少々を加え、手早く薄味の汁を作る。','おにぎりを器に入れて汁を注ぎ、あればねぎやのりをのせる。'],ko:['만들어 둔 구운 주먹밥을 팬, 오븐, 전자레인지로 속까지 데운다.','물 또는 다시에 간장과 소금 한 꼬집을 넣어 가벼운 국물을 만든다.','주먹밥을 그릇에 담고 국물을 부은 뒤 있으면 파나 김을 올린다.']}},
      {id:'japan-yakisoba-pan',cuisine:'japan',sourceStatus:'verified',source:'https://www.justonecookbook.com/everyday/bento/',translations:{en:{title:'Yakisoba bread roll',copy:'A popular snack-meal that puts stir-fried noodles inside a soft bread roll.'},zh:{title:'日式炒面面包',copy:'炒面夹进软面包，是日本常见的饱腹零食或便当主食。'},ja:{title:'焼きそばパン',copy:'炒めた麺をやわらかいパンにはさむ、日本で親しまれる軽食やお弁当の主食。'},ko:{title:'야키소바빵',copy:'볶음면을 부드러운 빵에 끼워 먹는 일본의 든든한 간식 또는 도시락 주식.'}},ingredients:[{label:'炒面',labels:{en:'yakisoba noodles',zh:'日式炒面',ja:'焼きそば麺',ko:'야키소바 면'},names:['炒面','日式炒面','yakisoba','yakisoba noodles','焼きそば','焼きそば麺','야키소바']},{label:'包菜',labels:{en:'cabbage',zh:'包菜',ja:'キャベツ',ko:'양배추'},names:['包菜','卷心菜','cabbage','キャベツ','양배추']},{label:'面包',labels:{en:'bread roll',zh:'面包卷',ja:'ロールパン',ko:'롤빵'},names:['面包','面包卷','bread','bread roll','パン','ロールパン','빵','롤빵']}],seasonings:['oil','soy'],equipment:['frying_pan'],steps:{en:['Stir-fry shredded cabbage and any small meat or vegetable pieces in a little oil.','Add ready yakisoba noodles and season with a savory sauce or soy sauce until hot and evenly coated.','Split a soft bread roll, fill it with the noodles, and eat right away or pack once cooled.'],zh:['少油炒包菜丝和可选的少量肉或蔬菜。','加入现成日式炒面，用炒面酱或酱油调味，炒到热透并均匀上色。','软面包切开夹入炒面，马上吃或放凉后装便当。'],ja:['千切りキャベツと、好みで少量の肉や野菜を油少々で炒める。','焼きそば麺を加え、ソースまたは醤油で全体が熱く均一になるまで炒める。','やわらかいロールパンに切り込みを入れて麺をはさみ、すぐ食べるか冷ましてから詰める。'],ko:['채 썬 양배추와 선택한 고기 또는 채소 조금을 기름에 볶는다.','야키소바 면을 넣고 소스 또는 간장으로 간해 고루 뜨거워질 때까지 볶는다.','부드러운 롤빵을 갈라 면을 넣고 바로 먹거나 식혀 도시락에 담는다.']}}

    recipes.push(...japaneseQuickMealRecipes);
    const existingJapaneseMethods={
      'japan-jibuni':{en:['Dust chicken pieces lightly with flour.','Simmer chicken in dashi seasoned with soy sauce and mirin.','Add greens and mushrooms at the end, cooking only until tender.'],zh:['鸡肉切块后薄薄拍上面粉。','用高汤、酱油和味醂调味，放入鸡肉小火煮。','最后加入青菜和蘑菇，煮软即可。'],ja:['鶏肉に薄く小麦粉をまぶす。','だしに醤油とみりんで味を付け、鶏肉を煮る。','最後に青菜ときのこを加え、火を通しすぎないようにする。'],ko:['닭고기에 밀가루를 얇게 묻힌다.','다시에 간장과 미림으로 간하고 닭고기를 끓인다.','마지막에 푸른 채소와 버섯을 넣어 너무 익지 않게 마무리한다.']},
      'japan-satsuma-jiru':{en:['Cut chicken and root vegetables into bite-size pieces.','Simmer them in dashi until the vegetables are tender.','Dissolve miso in a little broth, return it to the pot, and do not boil hard.'],zh:['把鸡肉和根茎蔬菜切成入口大小。','放进高汤煮到蔬菜变软。','用少量汤汁化开味噌后倒回锅中，不要大火沸腾。'],ja:['鶏肉と根菜を食べやすく切る。','だしで野菜がやわらかくなるまで煮る。','みそを煮汁で溶いて戻し、強く沸かさない。'],ko:['닭고기와 뿌리채소를 먹기 좋게 썬다.','다시에 채소가 부드러워질 때까지 끓인다.','된장을 국물에 풀어 넣고 세게 끓이지 않는다.']},
      'japan-hirayaachi':{en:['Mix flour, water, egg, and salt into a loose batter.','Stir in sliced green onion and any small vegetable pieces.','Pan-fry in a little oil until both sides are browned.'],zh:['把面粉、水、鸡蛋和盐调成较稀面糊。','拌入葱和少量切碎蔬菜。','用少量油煎至两面金黄。'],ja:['小麦粉、水、卵、塩をゆるめの生地に混ぜる。','切ったねぎと少量の野菜を混ぜる。','少量の油で両面をこんがり焼く。'],ko:['밀가루, 물, 달걀, 소금을 묽은 반죽으로 섞는다.','썬 파와 자투리 채소를 넣는다.','기름을 조금 두른 팬에 앞뒤로 노릇하게 굽는다.']},
      'japan-gomaae':{en:['Blanch the greens briefly, cool them, and squeeze out excess water.','Mix sesame paste with soy sauce and a little sugar if desired.','Toss the greens with the dressing just before serving.'],zh:['青菜快速焯熟，放凉后挤干水分。','把芝麻酱与酱油混合，喜欢甜味可加少量糖。','上桌前把青菜拌入酱汁。'],ja:['青菜をさっとゆでて冷まし、水気をしぼる。','ごまペースト、醤油、好みで少量の砂糖を混ぜる。','食べる直前に青菜を和える。'],ko:['푸른 채소를 살짝 데쳐 식힌 뒤 물기를 짠다.','참깨 페이스트와 간장, 취향에 따라 설탕 조금을 섞는다.','먹기 직전에 채소를 양념에 무친다.']},
      'japan-okonomiyaki':{en:['Mix shredded cabbage, flour, water, and egg into a thick batter.','Cook the batter in an oiled pan, adding pork slices if using.','Turn when set, cook through, and finish with your preferred sauce.'],zh:['把卷心菜丝、面粉、水和鸡蛋拌成较厚面糊。','在抹油平底锅中煎制，有猪肉片可放在表面。','定型后翻面煎熟，按喜好淋酱。'],ja:['千切りキャベツ、小麦粉、水、卵を厚めの生地に混ぜる。','油をひいたフライパンで焼き、豚肉を使う場合は上にのせる。','固まったら返して中まで焼き、好みのソースをかける。'],ko:['채 썬 양배추, 밀가루, 물, 달걀을 되직하게 섞는다.','기름 두른 팬에 굽고 돼지고기를 쓰면 위에 올린다.','굳으면 뒤집어 속까지 익힌 뒤 취향의 소스를 곁들인다.']},
      'japan-shippoku-udon':{en:['Cut daikon, carrot, tofu, fried tofu, and green onion into bite-size pieces.','Simmer the firm vegetables and fried tofu in dashi, then add tofu and soy sauce.','Warm boiled udon separately, place it in a bowl, and ladle the vegetable broth over it.'],zh:['把萝卜、胡萝卜、豆腐、油豆腐和葱切成入口大小。','在高汤中煮较硬的蔬菜和油豆腐，再加入豆腐和酱油。','另锅加热熟乌冬面，放入碗中后浇上蔬菜高汤。'],ja:['大根、にんじん、豆腐、油揚げ、ねぎを食べやすく切る。','だしで根菜と油揚げを煮てから、豆腐と醤油を加える。','ゆでうどんを別に温め、器に入れて具入りのだしをかける。'],ko:['무, 당근, 두부, 유부, 파를 먹기 좋게 썬다.','다시에 단단한 채소와 유부를 끓인 뒤 두부와 간장을 넣는다.','삶은 우동은 따로 데워 그릇에 담고 채소 다시를 붓는다.']}
    };
    recipes.forEach(recipe=>{if(existingJapaneseMethods[recipe.id])recipe.steps=existingJapaneseMethods[recipe.id]});
    const existingKoreanMethods={
      'korea-bibimbap':{en:['Prepare vegetables separately by blanching, sautéing, or seasoning them lightly.','Put warm rice in a bowl and arrange the vegetables, beef if using, and a fried egg on top.','Add gochujang and sesame oil to taste, then mix just before eating.'],zh:['分别焯、炒或简单调味各种蔬菜。','把热米饭放进碗中，摆上蔬菜、可选牛肉和煎蛋。','按口味加韩式辣酱和香油，吃前拌匀。'],ja:['野菜をゆでる、炒めるなどして、それぞれ軽く味を付ける。','温かいご飯に野菜、好みで牛肉と目玉焼きをのせる。','コチュジャンとごま油を好みで加え、食べる直前に混ぜる。'],ko:['채소를 데치거나 볶아 각각 가볍게 무친다.','따뜻한 밥에 채소와 선택한 소고기, 달걀프라이를 올린다.','고추장과 참기름을 취향껏 넣고 먹기 직전에 비빈다.']},
      'korea-bulgogi-rice':{en:['Mix thin beef with soy sauce, sugar, garlic, and sesame oil; rest briefly.','Stir-fry onion and the beef in a hot pan until cooked.','Spoon over warm rice and add sesame seeds or scallion if available.'],zh:['把薄牛肉与酱油、糖、大蒜和香油拌匀，略腌一会儿。','热锅炒洋葱和牛肉至熟。','盛在热米饭上，有芝麻或葱可加一点。'],ja:['薄切り牛肉を醤油、砂糖、にんにく、ごま油で和え、少し置く。','熱したフライパンで玉ねぎと牛肉を炒めて火を通す。','温かいご飯にのせ、あればごまやねぎを添える。'],ko:['얇은 소고기에 간장, 설탕, 마늘, 참기름을 섞어 잠시 재운다.','달군 팬에 양파와 소고기를 볶아 익힌다.','따뜻한 밥 위에 올리고 있으면 깨나 파를 곁들인다.']},
      'korea-kimchi-fried-rice':{en:['Chop kimchi and stir-fry it in oil until fragrant.','Add cold cooked rice and a little soy sauce, breaking up any clumps.','Cook until hot, then top with a fried egg if you have one.'],zh:['把泡菜切碎，用油炒出香味。','加入冷米饭和少量酱油，边炒边打散饭团。','炒热后即可，有鸡蛋可配一个煎蛋。'],ja:['キムチを刻み、油で香りが出るまで炒める。','冷やご飯と少量の醤油を加え、かたまりをほぐしながら炒める。','全体が熱くなったら、あれば目玉焼きをのせる。'],ko:['김치를 잘게 썰어 기름에 향이 나게 볶는다.','찬밥과 간장 조금을 넣고 밥알을 풀어가며 볶는다.','뜨거워지면 달걀프라이가 있으면 올린다.']},
      'korea-doenjang-jjigae':{en:['Bring water or anchovy stock to a simmer and dissolve doenjang in it.','Add potato, onion, zucchini, or any firm vegetables and cook until tender.','Add tofu near the end and simmer gently before serving.'],zh:['把水或小鱼干高汤煮开，化开韩式大酱。','放入土豆、洋葱、西葫芦或较硬的蔬菜，煮至软熟。','最后加入豆腐，小火再煮片刻即可。'],ja:['水またはいりこだしを温め、テンジャンを溶かす。','じゃがいも、玉ねぎ、ズッキーニなど火の通りにくい野菜を煮る。','最後に豆腐を加え、やさしく煮て仕上げる。'],ko:['물 또는 멸치 육수를 끓여 된장을 푼다.','감자, 양파, 주키니처럼 단단한 채소를 넣어 익힌다.','마지막에 두부를 넣고 부드럽게 더 끓여 낸다.']},
      'korea-tteokbokki':{en:['Mix gochujang, sugar, and water or stock in a pan and bring to a simmer.','Add rice cakes, cabbage, and green onion.','Cook, stirring often, until the rice cakes are soft and the sauce is glossy.'],zh:['把韩式辣酱、糖和水或高汤放进锅中煮开。','加入年糕、卷心菜和葱。','经常翻动，煮至年糕变软、酱汁浓亮。'],ja:['コチュジャン、砂糖、水またはだしをフライパンに入れて温める。','トック、キャベツ、ねぎを加える。','時々混ぜ、餅がやわらかく、たれにつやが出るまで煮る。'],ko:['고추장, 설탕, 물 또는 육수를 팬에 넣고 끓인다.','떡, 양배추, 파를 넣는다.','자주 저어가며 떡이 부드럽고 양념이 윤기 날 때까지 끓인다.']},
      'korea-kimbap':{en:['Season warm rice lightly with salt and sesame oil.','Lay nori on a mat, spread rice thinly, and line up cooked vegetables and fillings.','Roll tightly, slice with a damp knife, and serve.'],zh:['把热米饭用盐和香油轻轻调味。','紫菜铺在卷帘上，薄薄铺米饭，再排上熟蔬菜和馅料。','卷紧后用湿刀切段即可。'],ja:['温かいご飯に塩とごま油を軽く混ぜる。','巻きすにのりを置き、ご飯を薄く広げ、火を通した野菜や具を並べる。','しっかり巻き、濡らした包丁で切る。'],ko:['따뜻한 밥에 소금과 참기름을 가볍게 섞는다.','김발에 김을 펴고 밥을 얇게 펼친 뒤 익힌 채소와 속재료를 올린다.','단단히 말아 젖은 칼로 썬다.']},
      'korea-kimchi-jjigae':{en:['Sauté pork and aged kimchi in a pot until fragrant.','Add water or stock and simmer until the pork is tender.','Add tofu and green onion near the end; season to taste before serving.'],zh:['在锅中炒香猪肉和偏酸的泡菜。','加水或高汤，小火煮至猪肉变软。','最后加入豆腐和葱，尝味后再调味。'],ja:['鍋で豚肉と酸味の出たキムチを香りよく炒める。','水またはだしを加え、豚肉がやわらかくなるまで煮る。','最後に豆腐とねぎを加え、味を調えて仕上げる。'],ko:['냄비에 돼지고기와 익은 김치를 볶아 향을 낸다.','물 또는 육수를 넣고 돼지고기가 부드러워질 때까지 끓인다.','마지막에 두부와 파를 넣고 간을 맞춘다.']},
      'korea-japchae':{en:['Soak or boil glass noodles according to the package, then drain.','Stir-fry beef, mushrooms, and vegetables separately so they keep their color and texture.','Toss everything with soy sauce, sugar, and sesame oil while the noodles are warm.'],zh:['按包装浸泡或煮粉丝后沥干。','牛肉、蘑菇和蔬菜分别炒，保留颜色和口感。','趁粉丝温热时，全部加酱油、糖和香油拌匀。'],ja:['春雨を表示どおりに戻すかゆでて、水気を切る。','牛肉、きのこ、野菜は色と食感を残すよう別々に炒める。','春雨が温かいうちに、醤油、砂糖、ごま油で全体を和える。'],ko:['당면을 포장법대로 불리거나 삶아 물기를 뺀다.','소고기, 버섯, 채소는 색과 식감을 살리도록 따로 볶는다.','당면이 따뜻할 때 간장, 설탕, 참기름으로 모두 버무린다.']},
      'korea-budae-jjigae':{en:['Arrange kimchi, sausage, ham, tofu, and noodles in a shallow pot.','Mix chili paste with water or stock and pour it around the ingredients.','Bring to a boil and cook until the noodles are tender; share straight from the pot.'],zh:['把泡菜、香肠、火腿、豆腐和面条摆入浅锅。','把辣酱和水或高汤混合，沿锅边倒入。','煮开后煮至面条变软，可直接连锅分享。'],ja:['浅い鍋にキムチ、ソーセージ、ハム、豆腐、麺を並べる。','辛味調味料を水またはだしで溶き、具のまわりに注ぐ。','煮立てて麺がやわらかくなるまで煮て、鍋のまま取り分ける。'],ko:['얕은 냄비에 김치, 소시지, 햄, 두부, 면을 담는다.','고추장 양념을 물 또는 육수에 풀어 재료 둘레로 붓는다.','끓여 면이 부드러워지면 냄비째 나눠 먹는다.']}
    };
    recipes.forEach(recipe=>{if(existingKoreanMethods[recipe.id])recipe.steps=existingKoreanMethods[recipe.id]});
    const existingWesternMethods={
      'western-moussaka':{en:['Salt eggplant slices briefly, then roast or pan-cook them with potato slices.','Cook minced meat with tomato sauce until thick.','Layer potato, eggplant, meat sauce, and cheese; bake until browned and let it rest before slicing.'],zh:['茄子片稍微撒盐后，和土豆片一起烤或煎熟。','把肉末和番茄酱煮至浓稠。','依次铺土豆、茄子、肉酱和奶酪，烤至上色后静置再切。'],ja:['なすに軽く塩をしてから、じゃがいもと一緒に焼くか炒める。','ひき肉をトマトソースでとろみが出るまで煮る。','じゃがいも、なす、ミートソース、チーズを重ねて焼き、少し休ませてから切る。'],ko:['가지에 소금을 살짝 뿌린 뒤 감자와 함께 굽거나 팬에 익힌다.','다진 고기를 토마토소스와 함께 걸쭉하게 끓인다.','감자, 가지, 미트소스, 치즈를 겹쳐 구운 뒤 잠시 두었다가 자른다.']},
      'western-souvlaki':{en:['Cut meat into even cubes and marinate with olive oil, lemon, oregano, salt, and pepper.','Thread onto skewers with onion and tomato if using.','Grill or pan-sear, turning often, until browned and cooked through.'],zh:['把肉切成均匀小块，用橄榄油、柠檬、牛至、盐和胡椒腌制。','可与洋葱和番茄一起串成串。','烤或平底锅煎，常翻面至上色熟透。'],ja:['肉を同じ大きさに切り、オリーブ油、レモン、オレガノ、塩、こしょうで漬ける。','好みで玉ねぎやトマトと一緒に串に刺す。','時々返しながら、焼き色が付き中まで火が通るまで焼く。'],ko:['고기를 고르게 깍둑 썰어 올리브유, 레몬, 오레가노, 소금, 후추에 재운다.','원하면 양파와 토마토를 함께 꼬치에 꿴다.','자주 뒤집으며 노릇하고 속까지 익을 때까지 굽는다.']},
      'western-dolmadakia':{en:['Mix rice with chopped herbs, onion, olive oil, and seasoning.','Place a small spoonful on each vine leaf and roll into tight parcels.','Arrange seam-side down, add water and lemon, then simmer gently until the rice is tender.'],zh:['把米饭与切碎香草、洋葱、橄榄油和调味料混合。','每张葡萄叶包少量馅，卷紧成小卷。','接口朝下摆入锅中，加水和柠檬，小火煮至米饭软熟。'],ja:['ご飯に刻んだハーブ、玉ねぎ、オリーブ油、調味料を混ぜる。','ぶどうの葉に少量ずつのせ、きつく巻く。','巻き終わりを下にして並べ、水とレモンを加え、ご飯がやわらかくなるまで弱火で煮る。'],ko:['밥에 다진 허브, 양파, 올리브유, 양념을 섞는다.','포도잎마다 소량의 속을 올려 단단히 만다.','접힌 면이 아래로 가게 담고 물과 레몬을 넣어 밥이 부드러워질 때까지 약불로 끓인다.']},
      'western-lasagna-bolognese':{en:['Cook a thick meat ragù and prepare a white sauce if using.','Layer pasta sheets, ragù, white sauce, and cheese in a baking dish.','Bake until bubbling and browned, then rest before cutting.'],zh:['把肉酱煮至浓稠，需要时准备白酱。','在烤盘中交替铺千层面皮、肉酱、白酱和奶酪。','烤至冒泡上色，静置后再切。'],ja:['濃いめのミートラグーを作り、必要ならホワイトソースも用意する。','耐熱皿にラザニアシート、ラグー、ホワイトソース、チーズを重ねる。','ふつふつして焼き色が付くまで焼き、少し休ませてから切る。'],ko:['걸쭉한 미트 라구를 만들고 필요하면 화이트소스를 준비한다.','오븐 용기에 라자냐 면, 라구, 화이트소스, 치즈를 겹친다.','보글보글 끓고 노릇해질 때까지 구운 뒤 잠시 둔 다음 자른다.']},
      'western-keftedakia':{en:['Mix minced meat with grated onion, herbs, soaked bread, salt, and pepper.','Shape into small balls and dust lightly with flour if desired.','Shallow-fry in hot oil, turning until browned and cooked through.'],zh:['把肉末、洋葱泥、香草、泡软面包、盐和胡椒混合。','搓成小肉丸，喜欢可薄薄裹面粉。','用热油浅煎，翻动至上色熟透。'],ja:['ひき肉、すりおろし玉ねぎ、ハーブ、浸したパン、塩、こしょうを混ぜる。','小さな丸にし、好みで薄く小麦粉をまぶす。','熱い油で時々返しながら、焼き色が付き中まで火が通るまで揚げ焼きにする。'],ko:['다진 고기, 간 양파, 허브, 불린 빵, 소금, 후추를 섞는다.','작은 완자로 빚고 원하면 밀가루를 얇게 묻힌다.','뜨거운 기름에 굴려가며 노릇하고 속까지 익도록 얕게 튀긴다.']},
      'western-grilled-calamari':{en:['Pat calamari dry and cut into rings or open flat.','Season simply with olive oil, salt, pepper, and lemon.','Sear quickly in a very hot pan or on a grill; do not overcook.'],zh:['把鱿鱼擦干，切圈或摊平。','用橄榄油、盐、胡椒和柠檬简单调味。','用很热的锅或烤架快速煎烤，不要过度加热。'],ja:['いかの水気をふき、輪切りまたは開いた状態にする。','オリーブ油、塩、こしょう、レモンでシンプルに味付けする。','非常に熱いフライパンかグリルで手早く焼き、加熱しすぎない。'],ko:['오징어의 물기를 닦고 링 모양으로 썰거나 펼친다.','올리브유, 소금, 후추, 레몬으로 간단히 간한다.','아주 뜨거운 팬이나 그릴에 빠르게 굽고 너무 오래 익히지 않는다.']},
      'western-neapolitan-lasagna':{en:['Prepare a tomato meat sauce and have ricotta or mozzarella ready.','Layer pasta sheets with sauce, cheese, and any cooked fillings.','Bake until set and golden, then cool briefly so the layers hold.'],zh:['准备番茄肉酱，并备好里考塔或马苏里拉奶酪。','把面皮、酱汁、奶酪和熟馅料交替铺层。','烤至定型金黄，稍放凉让层次更稳定。'],ja:['トマトミートソースを作り、リコッタまたはモッツァレラを用意する。','パスタシート、ソース、チーズ、火を通した具を重ねる。','固まり焼き色が付くまで焼き、層が落ち着くまで少し置く。'],ko:['토마토 미트소스를 만들고 리코타 또는 모차렐라를 준비한다.','파스타 면, 소스, 치즈, 익힌 속재료를 차례로 겹친다.','단단해지고 노릇해질 때까지 구운 뒤 층이 잡히도록 잠시 식힌다.']},
      'western-pumpkin-lasagna':{en:['Roast or steam pumpkin until soft, then mash or slice it.','Layer pasta sheets with pumpkin, a mild sauce, and cheese.','Bake until tender and browned; rest a few minutes before serving.'],zh:['把南瓜烤或蒸至软熟，再压泥或切片。','将面皮、南瓜、清淡酱汁和奶酪交替铺层。','烤至软熟上色，出炉后静置几分钟再吃。'],ja:['かぼちゃを焼くか蒸してやわらかくし、つぶすか切る。','ラザニアシート、かぼちゃ、やさしい味のソース、チーズを重ねる。','やわらかく焼き色が付くまで焼き、数分休ませてから出す。'],ko:['호박을 굽거나 쪄서 부드럽게 만든 뒤 으깨거나 썬다.','라자냐 면, 호박, 순한 소스, 치즈를 겹친다.','부드럽고 노릇해질 때까지 구운 뒤 몇 분 두었다가 낸다.']}
    };
    recipes.forEach(recipe=>{if(existingWesternMethods[recipe.id])recipe.steps=existingWesternMethods[recipe.id]});
    const existingChineseMethods={
      'china-kung-pao-chicken':{en:['Toss diced chicken with a little starch and seasoning.','Stir-fry dried chili and aromatics in hot oil, then cook the chicken until nearly done.','Add the sweet-sour spicy sauce and peanuts; toss quickly until the chicken is glazed.'],zh:['鸡丁加少量淀粉和调味料抓匀。','热油炒香干辣椒和香料，再下鸡丁炒至将熟。','加入酸甜辣汁和花生，快速翻炒至鸡肉裹汁。'],ja:['角切りの鶏肉に少量の片栗粉と下味をまぶす。','熱い油で乾燥唐辛子と香味野菜を炒め、鶏肉をほぼ火が通るまで炒める。','甘酸っぱく辛いたれとピーナッツを加え、鶏肉にたれが絡むまで手早く炒める。'],ko:['깍둑 썬 닭고기에 전분과 밑간을 가볍게 한다.','뜨거운 기름에 마른 고추와 향신채를 볶고 닭고기를 거의 익을 때까지 볶는다.','새콤달콤한 매운 양념과 땅콩을 넣고 닭고기에 윤기 나게 빠르게 볶는다.']},
      'china-pickled-mustard-green-fish':{en:['Slice fish fillets and coat lightly with salt and starch.','Sauté pickled mustard greens, ginger, and chili, then add stock and bring it to a simmer.','Slide in the fish and poach gently just until opaque; do not boil hard.'],zh:['把鱼片切好，加盐和少量淀粉抓匀。','炒香酸菜、姜和辣椒，加高汤煮开。','放入鱼片小火滑熟，变白即可，不要大滚。'],ja:['魚の切り身に塩と少量の片栗粉をまぶす。','漬け菜、しょうが、唐辛子を炒め、だしを加えて煮立てる。','魚を入れて白くなるまでやさしく火を通し、強く沸かさない。'],ko:['생선 살에 소금과 전분을 가볍게 묻힌다.','절인 채소, 생강, 고추를 볶고 육수를 넣어 끓인다.','생선을 넣어 하얗게 익을 때까지만 부드럽게 익히고 세게 끓이지 않는다.']},
      'china-fish-fragrant-shredded-pork':{en:['Season shredded pork with starch and a little soy sauce.','Stir-fry carrot, wood ear mushroom, and pepper until just tender.','Add pork back with a sauce of soy sauce, vinegar, sugar, and chili paste; toss until glossy.'],zh:['肉丝加淀粉和少量酱油抓匀。','胡萝卜、木耳和辣椒炒至刚熟。','倒回肉丝，加酱油、醋、糖和辣椒酱调成的鱼香汁，炒至亮汁包裹。'],ja:['細切り豚肉に片栗粉と少量の醤油で下味を付ける。','にんじん、きくらげ、ピーマンをさっと炒める。','豚肉を戻し、醤油、酢、砂糖、辛味調味料のたれを加えて、つやが出るまで炒める。'],ko:['채 썬 돼지고기에 전분과 간장 조금으로 밑간한다.','당근, 목이버섯, 고추를 살짝 볶는다.','돼지고기를 다시 넣고 간장, 식초, 설탕, 매운 양념으로 만든 소스를 넣어 윤기 나게 볶는다.']},
      'china-twice-cooked-pork':{en:['Simmer pork belly until cooked through, cool slightly, and slice thinly.','Stir-fry the slices until they release some fat, then add chili bean paste or chili sauce.','Add cabbage or pepper and soy sauce; stir-fry quickly until the vegetables are just tender.'],zh:['五花肉煮熟后稍放凉，切成薄片。','下锅煸出部分油脂，再加豆瓣酱或辣椒酱炒香。','加入包菜或辣椒和酱油，大火快炒至蔬菜刚熟。'],ja:['豚バラ肉をゆでて少し冷まし、薄切りにする。','フライパンで脂が少し出るまで炒め、豆板醤または辛味調味料を加える。','キャベツまたはピーマンと醤油を入れ、野菜がちょうどよくなるまで強火で手早く炒める。'],ko:['삼겹살을 삶아 조금 식힌 뒤 얇게 썬다.','팬에 기름이 조금 나올 때까지 볶고 두반장 또는 매운 양념을 넣는다.','양배추나 고추와 간장을 넣고 채소가 막 익을 때까지 센 불에 빠르게 볶는다.']},
      'china-tomato-egg-drop-soup':{en:['Sauté tomato wedges with a pinch of salt until they soften.','Add water or stock and bring it to a gentle boil.','Slowly pour in beaten egg while stirring the soup, then season and serve.'],zh:['番茄切块后加少许盐炒软。','加水或高汤，煮至微沸。','边搅汤边慢慢淋入蛋液，调味后即可出锅。'],ja:['トマトをくし形に切り、少量の塩でやわらかくなるまで炒める。','水またはだしを加え、やさしく煮立てる。','スープを混ぜながら溶き卵をゆっくり流し入れ、味を調えて仕上げる。'],ko:['토마토를 썰어 소금 조금과 함께 부드러워질 때까지 볶는다.','물 또는 육수를 넣고 약하게 끓인다.','국물을 저으면서 푼 달걀을 천천히 부어 간을 맞춘다.']},
      'china-yangzhou-fried-rice':{en:['Scramble egg and cook shrimp briefly; set both aside.','Stir-fry diced vegetables, then add cold rice and break up every clump.','Return egg and shrimp, season with salt and soy sauce, and toss until hot.'],zh:['鸡蛋炒散，虾仁炒至变色后先盛出。','炒香切丁蔬菜，加入冷米饭并把饭团炒散。','倒回鸡蛋和虾仁，加盐和酱油炒至热透。'],ja:['卵を炒り、えびは色が変わるまで炒めて取り出す。','角切り野菜を炒め、冷やご飯を加えてかたまりをほぐす。','卵とえびを戻し、塩と醤油で味を付け、全体が熱くなるまで炒める。'],ko:['달걀을 스크램블하고 새우는 색이 변할 때까지 볶아 덜어 둔다.','깍둑 썬 채소를 볶은 뒤 찬밥을 넣어 뭉친 밥을 푼다.','달걀과 새우를 다시 넣고 소금과 간장으로 간해 뜨거워질 때까지 볶는다.']}
    };
    recipes.forEach(recipe=>{if(existingChineseMethods[recipe.id])recipe.steps=existingChineseMethods[recipe.id]});

    function suggestCookDeduction(food){
      const rem=Number(food.remaining_amount)||0;
      if(rem<=0)return 0;
      if(rem>=100)return Math.max(1,Math.round(rem/4));
      if(rem>=10)return Math.max(1,Math.round(rem/3));
      if(rem>1)return Math.min(rem,Number.isInteger(rem)?Math.min(2,rem):Number((rem/2).toFixed(2)));
      return rem;
    }

      const rTitle=cookingRecipeState.title;

          onUndo:async()=>{
            let{error:uErr}=await sb.from('meal_companions').update({remaining_amount:remaining,last_taken_at:prevLastTaken,taken_today_count:prevRawCount,taken_today_date:prevTakenDate}).eq('id',item.id).eq('user_id',user.id);
            if(uErr&&isMissingColumnError(uErr)){
              ({error:uErr}=await sb.from('meal_companions').update({remaining_amount:remaining,last_taken_at:prevLastTaken}).eq('id',item.id).eq('user_id',user.id));
            }

            item.remaining_amount=remaining;item.last_taken_at=prevLastTaken;item.taken_today_count=prevRawCount;item.taken_today_date=prevTakenDate;
            render();
          }
        });
      }finally{takingCompanionIds.delete(item.id)}
    }

            const timing=ALLOWED_TIMINGS.has(raw?.timing)?raw.timing:'after_meal';
            if(mealCompanions.some(c=>normText(c.name)===normText(name)&&c.timing===timing))continue;
            const kind=ALLOWED_COMPANION_KINDS.has(raw?.kind)?raw.kind:'supplement';
            const dose=Number.isFinite(Number(raw?.dose_per_take))&&Number(raw.dose_per_take)>0?Math.min(9999,Number(raw.dose_per_take)):1;
            const rem=Number.isFinite(Number(raw?.remaining_amount))&&Number(raw.remaining_amount)>=0?Math.min(MAX_AMOUNT,Number(raw.remaining_amount)):30;
            const init=Number.isFinite(Number(raw?.initial_amount))&&Number(raw.initial_amount)>0?Math.min(MAX_AMOUNT,Math.max(Number(raw.initial_amount),rem,dose)):Math.max(rem,dose,1);
            const unit=String(raw?.unit||t('defaultUnit')).trim().slice(0,12)||t('defaultUnit');
            const dailyTarget=Math.max(1,Math.min(12,Math.round(Number(raw?.daily_target)||1)));
            const expiresOn=isIsoDate(raw?.expires_on)?raw.expires_on:null;
            const note=String(raw?.note||'').trim().slice(0,300);
            let{error:err}=await sb.from('meal_companions').insert({user_id:user.id,name,kind,timing,dose_per_take:Number(dose.toFixed(3)),initial_amount:Number(init.toFixed(3)),remaining_amount:Number(rem.toFixed(3)),unit,daily_target:dailyTarget,expires_on:expiresOn,note});
            if(err&&isMissingColumnError(err)){
              ({error:err}=await sb.from('meal_companions').insert({user_id:user.id,name,kind,timing,dose_per_take:Number(dose.toFixed(3)),initial_amount:Number(init.toFixed(3)),remaining_amount:Number(rem.toFixed(3)),unit,expires_on:expiresOn,note}));
            }
            if(!err)addedCount++;
          }
        }
        if(addedCount>0){
          await load();
          showToast(t('backupImported',{count:addedCount}),'info');
        }else{
          showToast(t('backupImportEmpty'),'info');
        }
      }catch{
        showAppError(t('backupImportFailed'));
      }finally{
        if(btn)btn.disabled=false;if(mBtn)mBtn.disabled=false;
        e.target.value='';
      }
    };
    $('#foodForm').onsubmit=async e=>{
      e.preventDefault();
      const btn=$('#foodSubmit');if(btn.disabled)return;
      const f=Object.fromEntries(new FormData(e.target)),name=String(f.name||'').trim().slice(0,80),error=$('#foodError');
      error.classList.add('hidden');
      if(!name){msg(error,t('nameRequired'),'error');error.classList.remove('hidden');return}
      const category=ALLOWED_CATEGORIES.has(f.category)?f.category:'其他';
      const storage=ALLOWED_STORAGE.has(f.storage)?f.storage:'冷藏';
      const purchasedOn=isIsoDate(f.purchased)?f.purchased:localDateISO();
      const expiresOn=isIsoDate(f.expires)?f.expires:null;
      const readyToEat=f.readyToEat==='on',selectedMinutes=f.estimatedMinutes===''||f.estimatedMinutes===undefined?null:Number(f.estimatedMinutes),estimatedMinutes=Number.isInteger(selectedMinutes)&&selectedMinutes>=0&&selectedMinutes<=1440?selectedMinutes:null;
      const condition=ALLOWED_CONDITIONS.has(f.condition)?f.condition:'unknown';
      const note=String(f.note||'').trim().slice(0,500);
      const unit=String(f.unit||'').trim().slice(0,12),amount=Number(f.amount);
      if(!unit){msg(error,t('unitRequired'),'error');error.classList.remove('hidden');return}
      if(editingFood){
        if(!Number.isFinite(amount)||amount<0){msg(error,t('companionStockInvalid'),'error');error.classList.remove('hidden');return}
        if(amount>MAX_AMOUNT){msg(error,t('amountTooLarge'),'error');error.classList.remove('hidden');return}
        const target=editingFood;
        const prevRem=Number.isFinite(Number(target.remaining_amount))?Number(target.remaining_amount):0;
        const prevUnit=target.unit||unit;
        const nextRem=Number(amount.toFixed(3));
        const nextInit=Number(Math.max(Number(target.initial_amount)||0,nextRem).toFixed(3));
        const meta={name,category,initial_amount:nextInit,remaining_amount:nextRem,unit,purchased_on:purchasedOn,expires_on:expiresOn,storage,food_condition:condition,estimated_minutes:readyToEat?0:estimatedMinutes,ready_to_eat:readyToEat,note};
        btn.disabled=true;setBtnLabel(btn,t('saving'));
        try{
          let schemaPending=false;
          let{error:err}=await sb.from('food_items').update(meta).eq('id',target.id).eq('user_id',user.id);
          if(err&&isMissingColumnError(err)){
            schemaPending=true;
            const legacyMeta={name,category,initial_amount:nextInit,remaining_amount:nextRem,unit,purchased_on:purchasedOn,expires_on:expiresOn,storage,note};
            ({error:err}=await sb.from('food_items').update(legacyMeta).eq('id',target.id).eq('user_id',user.id));
          }
          if(err){msg(error,t('updateFoodFailed'),'error');error.classList.remove('hidden');return}
          if(Math.abs(nextRem-prevRem)>0.0005||unit!==prevUnit){
            const diff=Number(Math.abs(nextRem-prevRem).toFixed(3));
            await sb.from('food_events').insert({food_id:target.id,user_id:user.id,event_type:'adjusted',amount:diff||nextRem,note:t('eventCalibrated',{prev:fmt(prevRem)+prevUnit,next:fmt(nextRem)+unit})});
          }
          Object.assign(target,meta);
          close('foodDialog');
          render();
          showToast(schemaPending?t('foodUpdatedSchemaPending',{name}):t('foodUpdated',{name}),schemaPending?'warn':'info');
        }finally{btn.disabled=false;setBtnLabel(btn,editingFood?t('saveChanges'):t('saveCloud'))}
        return;
      }
      if(!Number.isFinite(amount)||amount<=0){msg(error,t('amountPositive'),'error');error.classList.remove('hidden');return}
      if(amount>MAX_AMOUNT){msg(error,t('amountTooLarge'),'error');error.classList.remove('hidden');return}
      const item={user_id:user.id,name,category,initial_amount:amount,remaining_amount:amount,unit,purchased_on:purchasedOn,expires_on:expiresOn,storage,food_condition:condition,estimated_minutes:readyToEat?0:estimatedMinutes,ready_to_eat:readyToEat,note};
      const existing=foods.find(food=>sameFoodKey(food,item)),amountText=fmt(amount)+item.unit;
      let mergeDecision='separate';
      if(existing){
        mergeDecision=await askMergeChoice(existing.name,fmt(existing.remaining_amount)+existing.unit,amountText);
        if(!mergeDecision)return;
      }
      btn.disabled=true;setBtnLabel(btn,t('saving'));
      try{
        if(existing&&mergeDecision==='merge'){
          const initial=Number((Number(existing.initial_amount)+amount).toFixed(3)),remaining=Number((Number(existing.remaining_amount)+amount).toFixed(3));
          const{error:updateError}=await sb.from('food_items').update({initial_amount:initial,remaining_amount:remaining}).eq('id',existing.id).eq('user_id',user.id);
          if(updateError){msg(error,t('mergeRestockFailed'),'error');error.classList.remove('hidden');return}
          const{error:eventError}=await sb.from('food_events').insert({food_id:existing.id,user_id:user.id,event_type:'adjusted',amount,note:t('eventRestockMerged',{amount:amountText})});
          existing.initial_amount=initial;existing.remaining_amount=remaining;
          if(eventError)showAppError(t('restockEventFailed'));else showToast(t('restockMerged',{name:existing.name,amount:amountText}),'info');
          close('foodDialog');render();return;
        }
        let schemaPending=false;
        let{data,error:err}=await sb.from('food_items').insert(item).select().single();
        if(err&&isMissingColumnError(err)){
          schemaPending=true;
          const legacyItem={user_id:item.user_id,name:item.name,category:item.category,initial_amount:item.initial_amount,remaining_amount:item.remaining_amount,unit:item.unit,purchased_on:item.purchased_on,expires_on:item.expires_on,storage:item.storage,note:item.note};
          ({data,error:err}=await sb.from('food_items').insert(legacyItem).select().single());
        }
        if(err){msg(error,t('saveFoodFailed'),'error');error.classList.remove('hidden');return}
        await sb.from('food_events').insert({food_id:data.id,user_id:user.id,event_type:'created',amount,note:t('eventCreated')});
        foods.push(data);
        close('foodDialog');render();
        showToast(schemaPending?t('foodSavedSchemaPending',{name:item.name}):t('foodSaved',{name:item.name}),schemaPending?'warn':'info');
      }finally{btn.disabled=false;setBtnLabel(btn,t('saveCloud'))}
    };
    function updateActionPreview(){
      if(!actionState)return;
      const{mode,food}=actionState,remaining=Number(food.remaining_amount),val=Number($('#actionAmount').value);
      const isGain=mode==='restock'||mode==='companion-restock';
      const preview=$('#actionPreviewVals'),hint=$('#actionDepleteHint');
      if(!Number.isFinite(val)||val<=0||val>MAX_AMOUNT||(mode==='consume'&&val>remaining)){
        preview.classList.add('hidden');hint.classList.add('hidden');return;
      }
      const next=isGain?Number((remaining+val).toFixed(3)):Number((remaining-val).toFixed(3));
      const depleting=mode==='consume'&&next<=0;
      const cls=isGain?'is-gain':(depleting?'is-deplete':'');
      const uLbl=unitLabel(food.unit);
      preview.innerHTML=`<span>${esc(fmt(remaining)+uLbl)}</span><span class="stock-preview-arrow">→</span><span class="stock-preview-next ${cls}">${esc(fmt(next)+uLbl)}</span>`;
      preview.classList.remove('hidden');
      if(depleting){hint.textContent=t('willDeplete');hint.classList.remove('hidden')}else hint.classList.add('hidden');
    }
    function openActionDialog(mode,food){
      actionState={mode,food};
      const isGain=mode==='restock'||mode==='companion-restock';
      const uLbl=unitLabel(food.unit);
      const remaining=Number(food.remaining_amount),initial=Number(food.initial_amount)||remaining,remainingText=fmt(remaining)+uLbl;
      $('#actionDialogTitle').textContent=(isGain?t('restock'):t('recordUsage'))+' · '+food.name;
      $('#actionDialogDesc').textContent=t('currentRemainingLabel',{remaining:remainingText});
      $('#actionAmountLabel').textContent=t('actionAmountLabel',{unit:uLbl});
      setBtnLabel('#actionSubmit',t('confirmAction'));
      $('#actionError').classList.add('hidden');
      $('#actionPreviewVals').classList.add('hidden');
      $('#actionDepleteHint').classList.add('hidden');
      const input=$('#actionAmount');input.value='';input.max=mode==='consume'?String(remaining):String(MAX_AMOUNT);
      const presets=[];
      if(mode==='companion-restock'){
        const steps=Math.max(remaining,initial)>=30?[10,30,60]:[5,10,30];
        steps.forEach(v=>presets.push({label:'+'+fmt(v)+' '+uLbl,val:v}));
      }else if(mode==='restock'){
        const scale=Math.max(remaining,initial);
        const steps=scale>=100?[100,250,500]:(scale>=20?[5,10,20]:[1,2,5]);
        steps.forEach(v=>presets.push({label:'+'+fmt(v)+' '+uLbl,val:v}));
      }else{
        if(remaining>=100){
          const quarter=Math.round(remaining/4);
          if(quarter>0)presets.push({label:fmt(quarter)+' '+uLbl,val:quarter});
        }else if(remaining>1){
          presets.push({label:'1 '+uLbl,val:1});
        }
        if(remaining>0.002)presets.push({label:t('quickHalf'),val:Number((remaining/2).toFixed(3))});
        presets.push({label:t('quickAll'),val:remaining});
      }
      $('#actionPresets').innerHTML=presets.map(p=>`<button class="time-chip" type="button" data-preset="${esc(p.val)}">${esc(p.label)}</button>`).join('');
      open('actionDialog');if(window.matchMedia('(pointer: fine)').matches)setTimeout(()=>input.focus({preventScroll:true}),220);
    }
    $('#actionAmount').oninput=()=>{
      $('#actionError').classList.add('hidden');
      const val=$('#actionAmount').value;
      $$('#actionPresets .time-chip').forEach(btn=>btn.classList.toggle('active',btn.dataset.preset===val));
      updateActionPreview();
    };
    $('#actionPresets').onclick=e=>{
      const btn=e.target.closest('[data-preset]');if(!btn)return;
      $('#actionAmount').value=btn.dataset.preset;
      $('#actionError').classList.add('hidden');
      $$('#actionPresets .time-chip').forEach(b=>b.classList.toggle('active',b===btn));
      updateActionPreview();
    };
    $('#actionForm').onsubmit=async e=>{
      e.preventDefault();if(!actionState)return;
      const{mode,food}=actionState,btn=$('#actionSubmit');if(btn.disabled)return;
      const error=$('#actionError'),amount=Number($('#actionAmount').value);
      error.classList.add('hidden');
      if(mode==='companion-restock'){
        if(!Number.isFinite(amount)||amount<=0){msg(error,t('restockAmountInvalid'),'error');error.classList.remove('hidden');return}
        if(amount>MAX_AMOUNT){msg(error,t('amountTooLarge'),'error');error.classList.remove('hidden');return}
        btn.disabled=true;setBtnLabel(btn,t('saving'));
        try{
          const remaining=Number(Math.min(MAX_AMOUNT,Number(food.remaining_amount)+amount).toFixed(3));
          const initial=Number(Math.min(MAX_AMOUNT,Math.max(Number(food.initial_amount)+amount,remaining)).toFixed(3));
          const{error:err}=await sb.from('meal_companions').update({initial_amount:initial,remaining_amount:remaining}).eq('id',food.id).eq('user_id',user.id);
          if(err){msg(error,isMissingTableError(err)?t('migration007Needed'):t('saveCompanionFailed'),'error');error.classList.remove('hidden');return}
          food.initial_amount=initial;food.remaining_amount=remaining;
          close('actionDialog');
          render();
          showToast(t('companionRestocked',{name:food.name,amount:fmt(amount)+food.unit}),'info');
        }finally{btn.disabled=false;setBtnLabel(btn,t('confirmAction'))}
        return;
      }
      if(mode==='restock'){
        if(!Number.isFinite(amount)||amount<=0){msg(error,t('restockAmountInvalid'),'error');error.classList.remove('hidden');return}
        if(amount>MAX_AMOUNT){msg(error,t('amountTooLarge'),'error');error.classList.remove('hidden');return}
        btn.disabled=true;setBtnLabel(btn,t('saving'));
        try{
          const initial=Number((Number(food.initial_amount)+amount).toFixed(3)),remaining=Number((Number(food.remaining_amount)+amount).toFixed(3));
          const{error:err}=await sb.from('food_items').update({initial_amount:initial,remaining_amount:remaining}).eq('id',food.id).eq('user_id',user.id);
          if(err){msg(error,t('restockSaveFailed'),'error');error.classList.remove('hidden');return}
          const amountText=fmt(amount)+food.unit,{error:eventError}=await sb.from('food_events').insert({food_id:food.id,user_id:user.id,event_type:'adjusted',amount,note:t('eventRestocked',{amount:amountText})});
          food.initial_amount=initial;food.remaining_amount=remaining;
          close('actionDialog');
          render();
          if(eventError)showAppError(t('restockEventFailed'));else showToast(t('restocked',{name:food.name,amount:amountText}),'info');
        }finally{btn.disabled=false;setBtnLabel(btn,t('confirmAction'))}
        return;
      }
      if(!Number.isFinite(amount)||amount<=0||amount>Number(food.remaining_amount)){msg(error,t('consumeAmountInvalid'),'error');error.classList.remove('hidden');return}
      btn.disabled=true;setBtnLabel(btn,t('saving'));
      try{
        const prevRemaining=Number(food.remaining_amount);
        const remaining=Number((prevRemaining-amount).toFixed(3));
        const{error:err}=await sb.from('food_items').update({remaining_amount:remaining}).eq('id',food.id).eq('user_id',user.id);
        if(err){msg(error,t('stockUpdateFailed'),'error');error.classList.remove('hidden');return}
        const amountText=fmt(amount)+food.unit,{error:eventError}=await sb.from('food_events').insert({food_id:food.id,user_id:user.id,event_type:'consumed',amount,note:t('eventConsumed')});
        food.remaining_amount=remaining;
        close('actionDialog');
        render();
        if(eventError)showAppError(t('consumeEventFailed'));
        else showToast(t('consumedSuccess',{name:food.name,amount:amountText}),'info',{
          onUndo:async()=>{
            const{error:uErr}=await sb.from('food_items').update({remaining_amount:prevRemaining}).eq('id',food.id).eq('user_id',user.id);
            if(uErr)throw uErr;
            await sb.from('food_events').insert({food_id:food.id,user_id:user.id,event_type:'adjusted',amount,note:t('eventUndoRestored',{amount:amountText})});
            food.remaining_amount=prevRemaining;
            render();
          }
        });
      }finally{btn.disabled=false;setBtnLabel(btn,t('confirmAction'))}
    };
    $('#foodList').onclick=e=>{
      if(e.target.closest('[data-clear-filter]')){foodFilter='all';foodStorage='';foodQuery='';$('#foodStorageFilter').value='';$('#foodSearch').value='';render();return}
      const depleteBtn=e.target.closest('[data-deplete-now]');
      if(depleteBtn){const food=foods.find(item=>item.id===depleteBtn.dataset.depleteNow);if(food)void markFoodUsedUpWithUndo(food);return}
      const editBtn=e.target.closest('[data-edit]');
      if(editBtn){const food=foods.find(item=>item.id===editBtn.dataset.edit);if(food)openEditFoodDialog(food);return}
      const restockBtn=e.target.closest('[data-restock]');
      if(restockBtn){const food=foods.find(item=>item.id===restockBtn.dataset.restock);if(food)openActionDialog('restock',food);return}
      const consumeBtn=e.target.closest('[data-consume]');
      if(consumeBtn){const food=foods.find(item=>item.id===consumeBtn.dataset.consume);if(food)openActionDialog('consume',food)}
    };
  </script>
</body>
